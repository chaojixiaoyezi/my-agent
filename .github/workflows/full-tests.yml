name: Full Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"  # nightly at 04:23 UTC

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run all tests
        run: python3 -m pytest -q --tb=short --timeout=120

      - name: Run slow tests
        run: python3 -m pytest -q -m slow --tb=short --timeout=300

      - name: Run security tests
        run: |
          python3 -m pytest -q -m security --tb=short --timeout=120 || status=$?
          if [ "${status:-0}" = "5" ]; then
            echo "No security-marked tests collected; skipping."
            exit 0
          fi
          exit "${status:-0}"

      - name: Run architecture guardrails
        run: python3 -m pytest agent_py_agent/tests/test_architecture_guardrails.py -q --tb=short

      - name: Check code size strict mode
        run: python3 scripts/check_code_size.py --mode strict --baseline CODE_SIZE_BASELINE.json
