name: Full Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"  # nightly at 04:23 UTC

jobs:
  full:
    runs-on: ubuntu-latest
    # 全量 + slow + security 三段在托管 runner 上超过 30 分钟（2026-09-25 实测被取消），预算按此放宽。
    timeout-minutes: 120

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Full suite 覆盖加密、队列/存储、Tracing 等正式 feature；依赖合同必须与 push Test
          # 一致，不能靠 runner 预装，也不能因为缺 optional extra 而把真实测试变成环境失败。
          python3 -m pip install -e ".[dev,secrets,scale]"

      - name: Run all tests
        # slow 测试有专门步骤（300s 限时）；这里排除，避免压力测试在 120s 限时下双跑超时
        run: python3 -m pytest -q -m "not slow" --tb=short --timeout=120

      - name: Run slow tests
        run: python3 -m pytest -q -m slow --tb=short --timeout=300

      - name: Run security tests
        run: |
          python3 -m pytest -q -m security --tb=short --timeout=120 || status=$?
          if [ "${status:-0}" = "5" ]; then
            echo "No security-marked tests collected; skipping."
            exit 0
          fi
          exit "${status:-0}"

      - name: Run architecture guardrails
        run: python3 -m pytest agent_py_agent/tests/test_architecture_guardrails.py -q --tb=short

      - name: Check local complexity guardrails
        run: python3 scripts/check_code_size.py --mode strict --baseline CODE_SIZE_BASELINE.json
