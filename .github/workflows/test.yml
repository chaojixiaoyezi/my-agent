name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # 完整 fast suite 会真实覆盖 secrets/scale extras；较慢 runner 的 3.10/3.12
    # 在 10 分钟总预算下已连续通过到 97% 后被平台取消。单测仍保留 60 秒超时。
    # fast suite 在 GitHub 托管 runner 上约需 30 分钟（2026-09-25 实测 15 分钟只跑到 52%），预算按此放宽。
    # 放开 userns 后 run_command 用例真的在 bwrap 里跑，单个 job 实测 40–45 分钟，45 分钟预算被顶满而整体取消（2026-09-25 13:24Z），再放到 60。
    # 2026-10-07：用例增多后单个 job 实测 53–60 分钟，10-07 两次推送的三个版本都在 60 分钟整被平台按超时取消（不是用例失败），放到 90。
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # 默认 fast suite 覆盖 secrets 与 scale 正式能力；测试环境必须按声明
          # 安装这些 feature extras，不能依赖 runner 预装，也不能在测试里临时跳过。
          python3 -m pip install -e ".[dev,secrets,scale]"

      - name: Install ripgrep for native search regressions
        # 文件发现/搜索的原生回归（test_opt_filesystem_cursor_context.py）必须执行真实 rg；ubuntu runner
        # 不预装 ripgrep（2026-10-31 CI 实测 shutil.which('rg') 为 None），按声明安装，不在测试里跳过。
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Prepare bubblewrap sandbox on the runner
        # ubuntu-24.04 runner 预装 bwrap，但 AppArmor 默认禁止非特权用户命名空间，sandbox 自检会以
        # BWRAP_ISOLATION_FAILED 失败，run_command 用例随之全部 fail-closed（2026-09-25 线上实测）。
        # 这里只放开 runner 自己的内核开关并复核自检；产品代码不做任何绕过。
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -c 'from agent_py_agent.agent.tooling.sandbox import main; raise SystemExit(main([]))'

      - name: Run fast tests
        run: |
          python3 - <<'PY'
          import concurrent.futures, os, shutil, subprocess, sys, tempfile, time
          from pathlib import Path

          shard_idx = int("${{ matrix.shard }}") - 1
          total_shards = 4
          all_files = sorted(str(p) for p in Path("agent_py_agent/tests").rglob("test_*.py"))
          files = [f for idx, f in enumerate(all_files) if idx % total_shards == shard_idx]
          batch_size = 25
          batches = [files[i:i + batch_size] for i in range(0, len(files), batch_size)]
          workers = max(1, min(os.cpu_count() or 2, 2))
          root_tmp = Path(tempfile.mkdtemp(prefix="pytest_ci_shards_"))

          def run_batch(idx: int, batch: list[str]):
              t0 = time.monotonic()
              basetemp = root_tmp / f"s_{idx}"
              res = subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", "-m", "not slow and not e2e", "--tb=short", "--timeout=60", f"--basetemp={basetemp}", *batch],
                  capture_output=True,
                  text=True,
              )
              shutil.rmtree(basetemp, ignore_errors=True)
              return idx, res.returncode, time.monotonic() - t0, res.stdout, res.stderr, batch

          failed = []
          ran_any = False
          done = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
              futs = [ex.submit(run_batch, idx, b) for idx, b in enumerate(batches)]
              for fut in concurrent.futures.as_completed(futs):
                  idx, rc, dt, out, err, b = fut.result()
                  done += 1
                  if rc == 0:
                      ran_any = True
                  if rc not in (0, 5):
                      print(f"[{done}/{len(batches)}] BATCH {idx} FAILED (rc={rc}, {dt:.1f}s): {b[0]} .. {b[-1]}", flush=True)
                      print(out, flush=True)
                      if err:
                          print(err, file=sys.stderr, flush=True)
                      failed.append(idx)
                  elif done % 10 == 0 or done == len(batches):
                      print(f"[{done}/{len(batches)}] BATCH {idx} OK ({dt:.1f}s)", flush=True)

          shutil.rmtree(root_tmp, ignore_errors=True)
          if failed or not ran_any:
              raise SystemExit(1)
          PY
