name: Cross-platform guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  focused:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q agent_py_agent scripts

      - name: Run cross-platform focused tests
        run: >
          python -m pytest
          agent_py_agent/tests/test_process_control.py
          agent_py_agent/tests/test_daemon_control.py
          agent_py_agent/tests/test_supervisor.py
          agent_py_agent/tests/test_dispatch_loop.py
          agent_py_agent/tests/test_policy_checks.py
          agent_py_agent/tests/test_subagent_policies.py
          agent_py_agent/tests/test_subagent_manager_core.py
          agent_py_agent/tests/test_r8_bounded_process_log.py
          agent_py_agent/tests/test_r8_claim_projection_eviction.py
          agent_py_agent/tests/test_r8_ledger_gc_pages.py
          agent_py_agent/tests/test_r8_pending_current_discovery.py
          agent_py_agent/tests/test_r8_compact_history_store.py::test_projection_header_without_o_nofollow_still_checks_real_identity
          agent_py_agent/tests/test_sandbox_output_capture.py::test_two_streams_have_separate_caps
          agent_py_agent/tests/test_sandbox_output_capture.py::test_small_output_preserves_text_completed_process_contract
          agent_py_agent/tests/test_sandbox_output_capture.py::test_reader_failure_exposes_stream_error_and_missing_eof
          -q

      - name: Check formatting whitespace
        run: git diff --check
