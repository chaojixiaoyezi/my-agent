name: Windows 文件时间与身份诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Observe path and descriptor identity within a synthetic directory
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          import json, os, sys, tempfile, time
          from pathlib import Path
          from agent_py_agent.agent.common.nofollow_fs import file_descriptor_change_ns
          FIELDS=('st_dev','st_ino','st_mode','st_nlink','st_size','st_mtime_ns','st_ctime_ns','st_birthtime_ns','st_file_attributes','st_reparse_tag')
          def info(s): return {k:getattr(s,k,None) for k in FIELDS}
          with tempfile.TemporaryDirectory() as d:
           p=Path(d)/'leaf'; p.write_bytes(b'first\r\n\x1asecond')
           for phase in ('initial','backdated'):
            if phase=='backdated':
             saved=p.stat(); time.sleep(2.05); p.write_bytes(b'other\r\n\x1asecond'); os.utime(p,ns=(saved.st_atime_ns,saved.st_mtime_ns))
            fd=os.open(p,os.O_RDONLY|getattr(os,'O_BINARY',0))
            try:
             before=os.fstat(fd); change=file_descriptor_change_ns(fd,before); raw=os.read(fd,100); after=os.fstat(fd)
             print(json.dumps({'phase':phase,'python':sys.version,'lstat':info(p.lstat()),'stat':info(p.stat()),'fstat_before':info(before),'fstat_after':info(after),'changed_ns':change,'byte_length':len(raw)},sort_keys=True))
            finally:os.close(fd)
      - name: Observe synthetic hot scan
        shell: pwsh
        run: |
          python -I .github/diagnostics/win_hot_snapshot.py --source "$env:GITHUB_WORKSPACE" --output "$env:RUNNER_TEMP/hot-source.json"
      - name: Install isolated test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify byte cursors, upgrade and overload responses
        run: >-
          python -m pytest -q --timeout=60 --tb=short
          agent_py_agent/tests/test_binary_snapshot_identity.py
          agent_py_agent/tests/test_r8_windows_hot_slice.py
          agent_py_agent/tests/test_r8_windows_tail_clocks.py
          agent_py_agent/tests/test_r8_observation_portable_tail.py
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_portable_source_uses_fd_clock_and_binary_bytes
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_old_five_field_checkpoint_resumes_byte_exact_portable_source
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_native_generation_unknown_or_changed_never_advances_checkpoint
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_cutover_closes_source_readers_before_replace_and_recovers_published_fence
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_cutover_rechecks_changed_source_after_closing_initial_reader
          agent_py_agent/tests/test_gateway_bounded_http_server.py
          agent_py_agent/tests/test_s1w1_http_lanes.py::test_replay_setup_failure_closes_original_socket_without_gc
