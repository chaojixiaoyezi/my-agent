name: Cross-platform guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  focused:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q agent_py_agent scripts

      - name: Run cross-platform focused tests
        run: >
          python -m pytest
          agent_py_agent/tests/test_process_control.py
          agent_py_agent/tests/test_binary_snapshot_identity.py
          agent_py_agent/tests/test_r8_windows_hot_slice.py
          agent_py_agent/tests/test_r8_windows_tail_clocks.py
          agent_py_agent/tests/test_r8_observation_portable_tail.py
          agent_py_agent/tests/test_r8_tui_default_stream.py
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_portable_source_uses_fd_clock_and_binary_bytes
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_old_five_field_checkpoint_resumes_byte_exact_portable_source
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_native_generation_unknown_or_changed_never_advances_checkpoint
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_cutover_closes_source_readers_before_replace_and_recovers_published_fence
          agent_py_agent/tests/test_v15_rework_r3_delivery_recovery.py::test_cutover_rechecks_changed_source_after_closing_initial_reader
          agent_py_agent/tests/test_curator_message_slices.py::test_large_hot_target_then_small_message_resumes_after_suffix_anchor
          agent_py_agent/tests/test_curator_message_slices.py::test_duplicate_id_keeps_first_match_and_prefix_blank_error
          agent_py_agent/tests/test_curator_message_slices.py::test_exact_metadata_byte_budget_defers_once_then_serves_big_and_small
          agent_py_agent/tests/test_r8_curator_audit_scope.py
          agent_py_agent/tests/test_message_prefix_proof.py
          agent_py_agent/tests/test_windows_process_observation.py
          agent_py_agent/tests/test_dispatch_host_wait_start_failures.py
          agent_py_agent/tests/test_darwin_process_tree_snapshot.py
          agent_py_agent/tests/test_shell_foreground_cleanup.py::test_natural_exit_cleans_child_after_outer_pipes_close
          agent_py_agent/tests/test_daemon_control.py
          agent_py_agent/tests/test_supervisor.py
          agent_py_agent/tests/test_dispatch_loop.py
          agent_py_agent/tests/test_policy_checks.py
          agent_py_agent/tests/test_subagent_policies.py
          agent_py_agent/tests/test_subagent_manager_core.py
          agent_py_agent/tests/test_r8_bounded_process_log.py
          agent_py_agent/tests/test_r8_candidate_cleanup_missing.py
          agent_py_agent/tests/test_r8_claim_projection_eviction.py
          agent_py_agent/tests/test_r8_claim_projection_lifecycle.py
          agent_py_agent/tests/test_r8_ledger_gc_pages.py
          agent_py_agent/tests/test_r8_pending_current_discovery.py
          agent_py_agent/tests/test_r8_compact_history_store.py::test_projection_header_without_o_nofollow_still_checks_real_identity
          agent_py_agent/tests/test_sandbox_output_capture.py::test_two_streams_have_separate_caps
          agent_py_agent/tests/test_sandbox_output_capture.py::test_small_output_preserves_text_completed_process_contract
          agent_py_agent/tests/test_sandbox_output_capture.py::test_reader_failure_exposes_stream_error_and_missing_eof
          -q

      - name: Verify native HTTP socket ownership and ordinary admission
        run: >-
          python -m pytest -q
          agent_py_agent/tests/test_s1w1_http_lanes.py
          agent_py_agent/tests/test_gateway_bounded_http_server.py
          -k "not real_gateway_complete_request_still_requires_authentication"

      # 隔离 Gateway 的测试宿主用 POSIX 进程组回收；Win32 在上一步实测原生 socket 生命周期。
      - name: Verify macOS Gateway admission and authenticated receipt
        if: runner.os == 'macOS'
        run: >-
          python -m pytest -q
          agent_py_agent/tests/test_s1w1_http_lanes.py::test_real_gateway_complete_request_still_requires_authentication
          agent_py_agent/tests/slo/test_slo_cliff.py

      - name: Check formatting whitespace
        run: git diff --check
