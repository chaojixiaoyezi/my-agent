[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.3.0"
description = "A small Python CLI agent with memory, tools, and auditable subagent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "prompt_toolkit>=3.0",
]

[project.scripts]
my-agent = "agent_py_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_py_agent*"]

[tool.setuptools.package-data]
agent_py_agent = [
  "config/*.yaml",
  "prompts/*.md",
]
