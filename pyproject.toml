[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.3.0"
description = "A small Python CLI agent with memory, tools, and auditable subagent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
my-agent = "agent_py_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_py_agent*"]

[tool.setuptools.package-data]
agent_py_agent = [
  "config/*.yaml",
  "prompts/*.md",
  "agent/subagent_workflows/builtin/*.json",
]

[tool.pytest.ini_options]
testpaths = ["agent_py_agent/tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
  "slow: stress or long-running scenario tests",
]

[tool.coverage.run]
branch = true
source = ["agent_py_agent"]
omit = [
  "agent_py_agent/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "agent_py_agent/data",
  "agent_py_agent/memory",
  "agent_py_agent/memory_archive",
  "my-agent-worktrees",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501",
]
