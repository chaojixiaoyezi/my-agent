[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-plugin-template"
version = "0.1.0"
description = "只在内存里统计 Unicode 字符数的 my-agent 插件模板"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
plugin_template = ["declaration.json"]
