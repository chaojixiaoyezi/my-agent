# 能力路由配置文件
# 说明：
# - 这里管的是“子代理/工具/skill 遇到不会做的事时，能不能向上级申请能力”。
# - 普通用户不需要配置每个子代理能用什么工具；默认由系统和 LLM 根据任务判断。
# - 只使用当前配置项；新增能力开关需要写进本文件和 AgentConfig。

# 是否启用能力路由。
# - true: 子代理遇到缺工具、缺 skill 或新问题时，可以写能力请求，让上级判断怎么补。
# - false: 关闭能力申请链路，子代理只能使用创建时已有的能力。
enable_capability_routing: true

# 下发能力是否只在当前任务有效。
# - true: 推荐默认值，任务结束后收回临时授权，避免污染后续任务。
# - false: 允许授权跨任务保留，后续需要更强审计。
capability_grant_expires_after_task: true

# 子代理 task-local 回合的 compact 触发百分比。
# - 0: 继承主配置 memory_compact_auto_trigger_percent（推荐，保持单一权威）。
# - 50-100: 子代理单独的触发点；长任务子代理上下文压力大时可调低提前触发。

# 失败自省自动拆分开关。
# - true: runner 失败自省（FailureIntrospector）判定 should_split 且给出拆分建议时，
#   自动把失败任务拆成子任务重新派工（原任务转 TAKEN_OVER，子任务进入 PLANNING）。
# - false: 推荐默认值。拆分会创建新任务、改变原任务状态，先由用户显式开启；
#   关闭时自省结果只记录在任务 attributes 里供人工决策。
subagent_failure_auto_split_enabled: false

# 失败自省自动拆分的最大深度。
# - 任务 depth 达到该值后不再自动拆分（防止拆分链无限加深）。
# - 0: 不限制深度（按统一约定 0 表示不限制；不建议生产使用）。
subagent_failure_split_max_depth: 2
