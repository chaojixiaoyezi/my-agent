# 能力路由与子代理运行状态配置文件
# 说明：
# - 这里管能力申请，以及子代理运行时的 compact/活动投影等专属行为。
# - 普通用户不需要配置每个子代理能用什么工具；默认由系统和 LLM 根据任务判断。
# - 只使用当前配置项；新增能力开关需要写进本文件和 AgentConfig。

# 是否启用能力路由。
# - true: 子代理遇到缺工具、缺 skill 或新问题时，可以写能力请求，让上级判断怎么补。
# - false: 关闭能力申请链路，子代理只能使用创建时已有的能力。
enable_capability_routing: true

# 下发能力是否只在当前任务有效。
# - true: 推荐默认值，任务结束后收回临时授权，避免污染后续任务。
# - false: 允许授权跨任务保留，后续需要更强审计。
capability_grant_expires_after_task: true

# 子代理 task-local 回合的 compact 触发百分比。
# - 0: 继承主配置 memory_compact_auto_trigger_percent（推荐，保持单一权威）。
# - 50-100: 子代理单独的触发点；长任务子代理上下文压力大时可调低提前触发。

# 失败自省自动拆分开关。
# - true: runner 失败自省（FailureIntrospector）判定 should_split 且给出拆分建议时，
#   自动把失败任务拆成子任务重新派工（原任务转 TAKEN_OVER，子任务进入 PLANNING）。
# - false: 推荐默认值。拆分会创建新任务、改变原任务状态，先由用户显式开启；
#   关闭时自省结果只记录在任务 attributes 里供人工决策。
subagent_failure_auto_split_enabled: false

# 失败自省自动拆分的最大深度。
# - 任务 depth 达到该值后不再自动拆分（防止拆分链无限加深）。
# - 0: 不限制深度（按统一约定 0 表示不限制；不建议生产使用）。
subagent_failure_split_max_depth: 2

# 是否把慢模型仍在持续返回流数据投影到子代理状态。
# - true: TUI/Web 能区分“模型很慢但仍有数据”和“完全没有活动”；只写阶段和计数，不写正文。
# - false: 只保留模型请求开始/结束和工具边界这些离散状态。
subagent_stream_activity_projection_enabled: true

# 慢模型流式活动最短刷新间隔（秒）。
# 默认 15 秒，避免每个 token 都写文件；小于 1 的值运行时按 1 秒处理。
subagent_stream_activity_interval_seconds: 15

# 是否提醒直属父级某个阶段长时间没有新活动；复用原心跳，不周期性调用模型。
# 提醒不是失败判定，不自动停止、重跑或接管；慢流只看最近数据，不看总工作时长。
subagent_activity_notices_enabled: true
# 首 token 尚未出现，或退避结束后仍长期无事件，提醒秒数；0 关闭此类提醒。
subagent_first_token_notice_seconds: 600
# 流已开始但长期无数据，或步骤之间没有新活动，提醒秒数；0 关闭此类提醒。
subagent_stream_idle_notice_seconds: 180
# 工具长时间未返回时的提醒秒数；可能仍在编译或等待审批，不判失败；0 关闭。
subagent_tool_wait_notice_seconds: 900
# 决策能力点默认关闭；observe 也会发请求并产生用量；模式不授予执行权限。
decision_subagent_model_mode: off
decision_subagent_model_timeout_seconds: null  # 有限正秒数；留空继承通用前台期限，零不是无限
decision_subagent_model_profile_id: null  # 留空继承通用 Decision 模型引用
# 子代理执行模型候选的原模型目录 ID；[] 使用全部当前授权的 agentic 模型。可按用户长期或会话设置覆盖，不按名称猜服务商。
decision_subagent_model_candidate_profile_ids: []
# 总开关与本点仍默认关闭。采用时 metadata 只缩减名卡/推荐，progressive 还延迟可选类别的未选中工具。
# 减量可能改变工作片间的缓存前缀/schema，不能把省输入等同于缓存命中；原工具搜索与执行权限不变。
decision_skill_tool_context_policy: progressive
# 可额外收起的工具类别是开放字符串列表；[] 不额外收起。不会修改原 tool_catalog_deferred_categories。
decision_skill_tool_optional_categories: ["plugins"]
decision_skill_tool_mode: off
decision_skill_tool_timeout_seconds: null  # 有限正秒数；留空继承通用前台期限
decision_skill_tool_profile_id: null  # 留空继承通用 Decision 模型引用

# my-agent 自己调决策等待时间的上下限（秒，整数）。
# - 只约束 my-agent 通过 user_config 的 decision_patch 调整各 timeout_seconds 字段（通用前台/阶段/后台与各接入点）；
#   用户在 /model 决策设置菜单里修改不受此限。
# - 越界时工具直接拒绝并返回允许范围，不会自动夹到边界。
# - 0: 该侧不限制（统一约定）。
decision_agent_timeout_min_seconds: 1
decision_agent_timeout_max_seconds: 30
