# 能力路由与子代理运行状态配置文件（随包默认模板）
# 说明：
# - 这里管能力包推荐与选择、能力申请的下发上限，以及子代理巡检、活动投影等专属行为。
# - 普通用户不需要配置每个子代理能用什么工具；默认由系统和 LLM 根据任务判断。
# - 本文件的键和值与 CapabilityConfig 默认值逐项一致（测试锁定）；新增能力开关必须同时写进本文件和 CapabilityConfig。
# 实际生效位置：
# - 用户 capability 配置只有一个位置：<agent 根目录>/config/capability_config.yaml。agent 根目录是
#   显式工作区（workspace_root 或 --workspace）；没有指定时就是所配 owner 的 home，例如 local/main 为
#   <MY_AGENT_HOME>/owners/local/main/config/capability_config.yaml。
# - 本文件（随包默认）只读、永不被写：用户位置不存在时按本文件的值运行；参数中心 /settings 写入
#   永远落在用户位置（不存在时新建，权限 0600/目录 0700），不会写进随包默认。
# - Gateway 读到的这一份被它服务的所有 owner 共用；找不到文件时按 CapabilityConfig 默认值运行，也就是本模板的值。
# - 要改能力配置：把本文件复制到上述位置再改。以下三个开关每次按文件现读，改完下一次判断马上生效：
#   capability_pack_self_install_enabled、plugin_self_install_enabled、enable_capability_package_selection。
#   读不到或文件坏按各键的 CapabilityConfig 默认值处理（这三个默认都关）；其余项仍缓存，修改后要重启 Gateway。
# - 旧位置 <agent 根目录>/agent_py_agent/config/capability_config.yaml 不再当用户配置读取；
#   那里存在非随包默认文件时会在配置告警里提示，不会静默合并。
# - daemon、gateway scenario 和 subagents 系列 CLI 子命令默认直接读本随包文件，可用 --capability-config 指定别的文件。

# 是否按当前任务展示相关能力包摘要，独立于能力申请和可选决策模型开关。
# - true: 仅从当前已启用且已授权的包中软排序，复用候选数量和元数据预算；不读正文、不调用模型或执行资源。
# - false: 关闭动态包推荐，静态目录、手动检索和显式读取保持可用。
enable_capability_package_recommendations: true

# 是否在新主任务首次业务请求前，用准备时绑定的主模型选择已授权能力包。
# - 默认关闭；开启会增加辅助模型用量、等待时间和原任务记录，并有界读取选中包的入口。
# - 有授权候选时，纯问答或空选也会留下普通任务记录，可在任务列表看到；不创建 Goal，不改变 Goal 的运行状态。
# - 每任务只准备一次，明确空选、失败、停止及续跑均不自动重试；旧任务不补选。
# - 新子线程仅在原首请求资格内读取显式授权且同代 pin 的入口，不运行选择模型、不改 pin；旧线程不补资格。
# - 子入口复用下方总预算及原权限；Jev 关闭仍可准备入口，关闭本开关则保持原子代理路径。
# - 只选择原有权限内的包，不执行包内脚本，不扩大工具权限；后续正常自动选模仍可能改变业务模型。
# - 管理员 /settings 或配置文件改完，下一次主任务/子入口判断马上生效，不用重启；其它预算项仍要重启。
enable_capability_package_selection: false
# 选择请求的输入预算，包含用户需求、完整候选摘要和响应 schema；0 不设独立配额，仍受模型窗口限制。
# 候选只受输入预算限制，不受推荐候选数上限限制；预算不足按现有推荐打分稳定排序，同分保留原序，不过滤零分包。
# 后端原有结构化重试可能带来多次 HTTP；输出沿原模型配置，不保证固定一次 HTTP 或固定总 token。
capability_package_selection_max_input_tokens: 3000
# 只控制推荐提示中“本轮能力包候选”段的条数；0 不限制推荐条数，仍受元数据预算限制，不控制开工前选包。
capability_candidate_limit: 5
# 主选包与子授权入口装配共用的总 token 预算，包含读取回执；读不完保留准确分页信息，0 仍受模型窗口限制。
capability_bundle_max_tokens: 3000

# 下发能力是否只在当前任务有效。
# - true: 推荐默认值，任务结束后收回临时授权，避免污染后续任务。
# - false: 允许授权跨任务保留，后续需要更强审计。
capability_grant_expires_after_task: true
# 单次能力申请最多下发的 Skill 数；按检索顺序选取可信命中，超出的不再下发。0 表示不限制。
capability_grant_max_skills: 0
# 单次能力申请最多下发的工具数；规则同上。0 表示不限制。
capability_grant_max_tools: 0

# 子代理巡检（due-check、恢复树）阈值。
# 心跳停滞超过该秒数记为巡检问题，超过 3 倍升为 P0；0 关闭心跳停滞检查。
subagent_heartbeat_timeout: 0
# 任务运行超过该秒数记为超时问题（P0），建议缩小范围、重派或接管；0 关闭。
subagent_run_timeout: 0
# 同一任务连续这么多次尝试都没有进展时触发无进展熔断：停止自动重试和扩容，汇总引用后等父级或用户决策；0 关闭熔断。
subagent_no_progress_attempt_limit: 4

# 失败自省自动拆分开关。
# - true: runner 失败自省（FailureIntrospector）判定 should_split 且给出拆分建议时，
#   自动把失败任务拆成子任务重新派工（原任务转 TAKEN_OVER，子任务进入 PLANNING）。
# - false: 推荐默认值。拆分会创建新任务、改变原任务状态，先由用户显式开启；
#   关闭时自省结果只记录在任务 attributes 里供人工决策。
subagent_failure_auto_split_enabled: false

# 失败自省自动拆分的最大深度。
# - 任务 depth 达到该值后不再自动拆分（防止拆分链无限加深）。
# - 0: 不限制深度（按统一约定 0 表示不限制；不建议生产使用）。
subagent_failure_split_max_depth: 2

# 是否把慢模型仍在持续返回流数据投影到子代理状态。
# - true: TUI/Web 能区分“模型很慢但仍有数据”和“完全没有活动”；只写阶段和计数，不写正文。
# - false: 只保留模型请求开始/结束和工具边界这些离散状态。
subagent_stream_activity_projection_enabled: true

# 慢模型流式活动最短刷新间隔（秒）。
# 默认 15 秒，避免每个 token 都写文件；小于 1 的值运行时按 1 秒处理。
subagent_stream_activity_interval_seconds: 15

# 是否提醒直属父级某个阶段长时间没有新活动；复用原心跳，不周期性调用模型。
# 提醒不是失败判定，不自动停止、重跑或接管；慢流只看最近数据，不看总工作时长。
subagent_activity_notices_enabled: true
# 首 token 尚未出现，或退避结束后仍长期无事件，提醒秒数；0 关闭此类提醒。
subagent_first_token_notice_seconds: 600
# 流已开始但长期无数据，或步骤之间没有新活动，提醒秒数；0 关闭此类提醒。
subagent_stream_idle_notice_seconds: 180
# 工具长时间未返回时的提醒秒数；可能仍在编译或等待审批，不判失败；0 关闭。
subagent_tool_wait_notice_seconds: 900

# 子代理执行器已退出（宿主证实、这一轮没有结果）时，是否在给直属父级的完成通知里附结构化接替提示（哪个 run、退出原因、怎么用 replacement_for_run_ids 声明接替）。
# - true: 父级模型在唤醒回执里看到这条提示；只是提示，不自动派工或接管，是否接替仍由父级决定。
# - false: 推荐默认值；会改变父级模型看到的内容，先由用户显式开启。
# 只能由你经 /settings（管理员）或配置文件修改，模型不能自己打开；改后重启 Gateway 生效。
subagent_takeover_hint_enabled: false
# 派子代理时能不能把本会话里的图片/视频一起交给子代理（第 14 条）。
# - true: 带附件的回合在模型上下文里多一段结构化附件清单 [INPUT_MEDIA_MANIFEST]（每个附件一个 media_ref）；create_subagents 多一个
#   input_media_refs 参数；父代理把 media_ref 原样填进去，宿主核对附件确实属于父会话（本轮附件或历史轮）再交给子代理首个请求，
#   走现有附件和媒体管线，子代理首轮选模按同一模态规则。
# - false: 推荐默认值；工具说明和请求内容与原来逐字节一致，传了 input_media_refs 会被结构化拒绝（SUBAGENT_INPUT_MEDIA_DISABLED）。
# 只能由你经 /settings（管理员）或配置文件修改，模型不能自己打开；改后下一次读取生效。
subagent_input_media_enabled: false

# 能力包宿主核验（能力包 v2，第 11 条）：任务钉住了声明检查程序的能力包时，宿主是否自动运行包里按 sha 钉住的原版检查程序。
# - true: 写工具写出声明的交付物后马上检查，回执附有上限的结论；收尾时对本回合改过的交付物再查一次，有错误给模型一次返工提示；
#   回合结束时宿主发一条检查结论提示。检查程序只在沙箱里跑（断网、交付物只读、只写临时目录），没有沙箱就不跑。
# - false: 推荐默认值；宿主执行包里的代码属于安全边界，先由用户显式开启（启用包时仍要单独确认检查程序）。
# 只能由你经 /settings（管理员）或配置文件修改，模型不能自己打开；改后重启 Gateway 生效。
capability_pack_host_verification_enabled: false

# 能力包自动装（learnpack 第一期）：她自己学外部 agent、自己打好的能力包，要不要不经你确认直接装上。
# - true: 她做好就自己装上（只装她自己打包、指纹对得上的包），装完告诉你装了什么、怎么删、怎么关掉自动装。
# - false: 推荐默认值；她做好先问你，并给你一行确认命令，你发回来才装（隔多久都有效，只执行一次）。
# 包里要宿主运行的检查程序不归这个开关管，跟着 plugin_self_install_enabled 走。
# 只能由你经 /settings（管理员）或配置文件修改，模型不能改；改完马上生效，不用重启。
# 撤回：发 /settings set capability_pack_self_install_enabled false。
capability_pack_self_install_enabled: false

# 插件自动装（learnpack 第一期）：她自己造的插件，要不要不经你确认直接装上并启用。
# - true: 她做好就自己装上并启用（只装她自己打包、指纹对得上的插件），装完告诉你装了什么、怎么删、怎么关掉自动装；
#   插件装上以后能做什么仍按现有插件权限规则，这个开关只管"谁来按安装"。
# - false: 推荐默认值；她做好先问你，并给你一行确认命令，你发回来才装。
# 能力包里要宿主运行的检查程序也跟这个开关走（会运行程序的都算装备）。
# 只能由你经 /settings（管理员）或配置文件修改，模型不能改；改完马上生效，不用重启。
# 撤回：发 /settings set plugin_self_install_enabled false。
plugin_self_install_enabled: false

# 屏幕/页面观察的自动执行（J16 第 7 节）：action_candidate 决策点（决策设置里模式为 apply）采用 Jev 的选择后，宿主要不要替主模型
# 自动执行一次动作。
# - true: 所选候选恰有一个只凭候选编号就能调用的动作工具（如 click_candidate）时，宿主以 actor=decision 调用它，走和模型调用
#   完全一样的审批、复核、归档；需要文字的动作（输入）永远不自动执行；两个及以上可选动作不执行；同一观察只执行一次，模型已经
#   动作过的观察不执行；复核拒绝、失败、用户拒绝都不重试、不改选候选。只对本机管理员主代理生效。
# - false: 推荐默认值；只给提示，不替用户点任何东西。
# 只能由你经 /settings（管理员）或配置文件修改，模型不能自己打开；改后下一次读取生效。
action_candidate_auto_execute_enabled: false
# 决策能力点默认关闭；observe 也会发请求并产生用量；模式不授予执行权限。
decision_subagent_model_mode: off
# 子代理执行模型候选的原模型目录 ID；[] 使用全部当前授权的 agentic 模型。可按用户长期或会话设置覆盖，不按名称猜服务商。
decision_subagent_model_candidate_profile_ids: []
# 总开关与本点仍默认关闭。采用时 metadata 只缩减名卡/推荐，progressive 还延迟可选类别的未选中工具。
# 减量可能改变工作片间的缓存前缀/schema，不能把省输入等同于缓存命中；原工具搜索与执行权限不变。
decision_skill_tool_context_policy: progressive
# 可额外收起的工具类别是开放字符串列表；[] 不额外收起。不会修改原 tool_catalog_deferred_categories。
decision_skill_tool_optional_categories: ["plugins"]
decision_skill_tool_mode: off  # 技能/工具上下文决策点模式（off/observe/apply）；默认关闭，observe 也会发请求并产生用量

# my-agent 自己调决策等待时间的上下限（秒，整数）。
# - 只约束 my-agent 通过 user_config 的 decision_patch 调整各 timeout_seconds 字段（通用前台/阶段/后台与各接入点）；
#   用户在 /model 决策设置菜单里修改不受此限。
# - 越界时工具直接拒绝并返回允许范围，不会自动夹到边界。
# - 0: 该侧不限制（统一约定）。
decision_agent_timeout_min_seconds: 1  # my-agent 自调决策等待时间下限（秒）；0 表示该侧不限制
decision_agent_timeout_max_seconds: 30  # my-agent 自调决策等待时间上限（秒）；0 表示该侧不限制

# 会话间消息与派活（第一期只开给管理员）。
# - 判定只读结构化 owner_kind 与下面这些开关，不解析任何文本。
# - 管理员（owner_kind=main，含 IM 里用 /admin 绑定后的私聊）之间的会话可以互发消息、可以派任务。
# - 普通用户（owner_kind=user）两种能力默认关闭；跨 owner 一律拒绝并返回结构化错误码。
# 管理员会话之间发消息开关；默认开。
session_messaging_admin_enabled: true
# 普通用户发消息开关；默认关（做用户隔离时再打开）。
session_messaging_user_enabled: false
# 管理员会话之间派任务开关；默认开。
session_task_admin_enabled: true
# 派活链深度上限：由对端任务触发的任务会沿着 origin_task_id 链累计，超过就拒绝；0 表示不限制。
session_task_max_chain_depth: 4
# 每对会话（发送会话, 接收会话）每小时的消息上限；任务回报与取消通知也计入；0 表示不限制。
session_pair_hourly_limit: 60
