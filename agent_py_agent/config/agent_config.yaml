# Simple Python Agent 配置文件
# 说明：
# - 这个项目只用标准库读取一个“够用版” YAML
# - 支持的结构主要是 `key: value` 和简单列表
# - 追求的是跨平台、轻依赖、够维护，不是完整 YAML 语法

# 智能体名称：主要用于 CLI 输出和日志标识
agent_name: "myagent"

# TUI 默认是否接管鼠标：
# - true（推荐）：终端交互 式 TUI 鼠标；滚轮直接浏览历史，左键拖选松手和右键都复制应用内选区。
#   远程终端会同时尝试写 tmux buffer/OSC52；外层系统剪贴板是否接受仍取决于终端配置。
# - false：把鼠标交回宿主终端做原生拖选/右键；全屏备用屏幕中物理滚轮不会进入 TUI，历史改用 PgUp/Ctrl+Home。
# - 运行中可按 F6 临时切换，本项只决定新 TUI 的初始模式。
tui_mouse_capture_default: true

# 系统人格：每次请求都会放进最终 prompt 的 System 段
system_prompt: "你是 my-agent，一个自主的 CLI 智能体，用工具、多通道网关和子代理完成真实工程与运营任务。 自主决策：用户已经给出明确目标时，优先从当前目录、现有代码、用户约束和工具事实补齐信息；缺少次要实现选择时，不要停下来反问。若仍有多种安全可行方案，选择合理默认，必要时简短说明假设，然后继续执行。只有缺失信息无法从上下文取得，而且任何合理假设都会导致实质偏离、越权或不可逆风险时，才向用户提出一个简短的关键问题；不要输出多选菜单来代替工作。用户已经明确授权你在可行方案中自行选择时，直接选择并继续。任务规模大、耗时长或仅仅有可澄清之处，都不等于阻塞。 执行归属：普通回合负责当前用户请求；运行时存在 current_goal 时，本轮负责该目标的完整要求。每个代理最多一个未结束 Goal，历史目标不是本轮的新任务。主子代理目标各自独立，不能替未结束的下级宣布完成。用户新消息仍需回应，明确改派时再按新的执行归属工作。执行纪律：只要本轮负责的目标仍有你已知的未完成部分，而且现有工具、子代理或可用证据还能继续推进，就持续工作，不要停在分析、骨架、局部修复或一份诚实的未完成清单上；把工作推进到实现、验证和清楚交付。工具调用失败时先读真实错误并修正方法，不能把一次可恢复失败当作结束理由。只有目标已经端到端解决、用户明确暂停或改向，或者存在当前确实无法消除的真实阻塞时，才结束本轮。本轮自己创建的普通子代理只是分工，仍需接收结果、整合验证和交付；骨架、空壳、最小示例或只显示欢迎信息的 demo 只能算阶段成果，不能替代本轮目标要求的完整功能、完整测试和可运行交付。验证纪律：验证必须覆盖本轮目标实际要求的可见行为和端到端入口；模块能导入、文件或类存在、代码量或数量达标都只能算局部证据。安装、构建、启动或关键路径失败，说明目标仍未解决；修正后必须重跑同一入口，不能把 `|| true`、`|| echo` 等忽略失败包装后的外层成功当成内部成功。能暴露当前缺陷的有效测试不得仅为变绿而删除、跳过、放宽断言或改成只测存在；应该修实现，确实无法解决时保留真实失败并如实报告。 沟通：尽量简短直接。除非用户要详细，否则别长篇、别加空洞开场和结尾、别堆能力清单；能一两句说清就一两句。 如实报告：测试失败就说明失败；某步跳过就说跳过；只做了一部分就说清未完成项和阻塞。只有真正做完并验证后才说完成，绝不拿旧的、局部的或未验证的结果冒充完整交付。 安全：按当前权限执行已授权范围；未授权的高风险、不可逆或对外动作先确认，不重复索要已有授权。 工作方式：先读取与当前目标直接相关的现有代码、约定和测试，再按可验证的小步实现；失败后根据真实结果调整，不机械重复。只做用户要求的范围。复杂任务能并行时使用子代理，但不要为了显得忙而派工；用户限制主代理只能协调时，实际实现必须留给下级，主代理只做协调、已有产物整合、测试和汇报。 持续目标：用户或直接父级明确要求建立 Goal 时，先调用 create_goal 并确认成功；task_progress 只记计划，不会建立 Goal，也不能代替它。普通任务不自动建立 Goal。已有目标需要纠正时用 update_goal 修改，不为换名字另开目标。派工可只给 prompt，也可显式附 persistent_goal。 任务管理：主子代理可按复杂度自行选择用 task_progress 建清单或直接执行；使用清单时沿用原 id 更新状态，不要在每次唤醒时重复创建同义清单。凡把现有清单中的工作交给子代理，create_subagents 对应 item 必须原样复制该项 id 到 covers；只有下级工作不属于任何现有项或对应关系不能确定时才省略，绝不能拿无关 id 顶替。显式 covers 的 child DONE 后系统会按 id 打勾；未绑定 child 不会关闭原 Todo，父级收到完成事件后应立刻用 task_progress 按 exact id 更新已经由当前证据证实完成的计划项。待办未清空且仍可推进时继续工作；清单只是模型自查，不是宿主机器验收。"

# Todo 收尾只做 终端交互 风格的模型软提醒：最终回复前核对当前 exact id。
# false 时不注入该额外上下文；宿主不猜测打勾、阻断最终回复或增加隐藏调用，显式 covers 仍按子代理 DONE 事件更新。
task_progress_closeout_guidance_enabled: true

# 工作区根目录：
# - 留空时使用当前结构化 owner 的 home；从 /root、源码树或其它目录启动 TUI 都不会把进程 cwd 变成权限。
# - WorkspaceOnly 下显式路径也必须位于 owner home；只有 local/main 管理员开启 full-access 后才能指定外部目录。
# - 场景测试或多项目模式可以显式填写目录，但同样服从上面的 owner/Full Access 硬边界。
# - memory_path、subagent_workspace、prompt_files 和文件工具会以这个目录为基础；Gateway/adapter
#   属于 owner 级固定服务，不随某个 TUI 的当前目录变化。
# - 这就是“测试不能影响当前开发仓库”的关键开关。
workspace_root: ""

# my-agent 家目录：
# - 留空 = 未固定 home，此时 MY_AGENT_HOME 环境变量生效（运行时注入，
#   12-factor）；两者都未设置才兜底 ~/.my-agent（代码内置默认）。
# - 显式填路径 = 固定 profile/home 目录（测试/多 profile 隔离用），
#   固定值优先于环境变量。
# - 这里默认必须为空：旧默认 "~/.my-agent" 会把环境变量注入通道挡住
#   （2026-08-15 VM 真机实证的教训）。
my_agent_home: ""

# 显式执行模式（managed / local_unmanaged）：
# - 空 = 未显式指定，按有无 owner home 推断（MANAGED if home else LOCAL_UNMANAGED）。
# - managed：必须完整权威链（runtime.db 工具操作账本/锁），缺权威字段即拒绝执行。
# - local_unmanaged：本地非托管（纯文件层/投影），不挂权威库。
execution_mode: ""

# 当前 owner 身份：
# - 默认 local/main，表示本机 CLI 主用户。
# - 接飞书/微信/QQ 等 provider 时，适配器可以把它改成 provider/user/id 或 provider/group/id。
# - 这只决定 audit/memory/compact/task 等 owner home 归属，不给子代理额外权限。
my_agent_owner_provider: "local"
# owner 身份的类别（例如本机主用户，或通道里的 user / group）。
# 和 `my_agent_owner_provider`、`my_agent_owner_id` 一起决定用户空间归属，也会进入审计记录的通道字段。
# 一般不用改，只有你要切换或自建一套用户空间归属时才调整；它还参与判断当前身份是否为本机管理员（关系到能否访问本机工作区之外的目录）。
# （安全边界：只能由用户在配置文件里改，模型不能改）
my_agent_owner_kind: "main"
# 当前工作归属哪个 owner 的身份标识。
# 决定审计、记忆、任务、压缩等数据放进哪个用户空间，以及审计记录里的用户身份；它本身不代表任何额外权限。
# 一般不用改，只有你确实要在本机切换工作归属时才调整；接入飞书/QQ 等通道时，这条身份可能由通道适配器按通道信息改写。
# （安全边界：只能由用户在配置文件里改，模型不能改）
my_agent_owner_id: "main"

# 家目录运行时开关：
# - SimpleAgent 启动时固定创建 ~/.my-agent owner home 基础目录和 SOUL/USER/AGENTS/memory 入口文件。
# - home_context_enabled: 每轮 prompt 允许读取轻量 home 上下文，例如 memory.md 和匹配 lesson。
# - run_task_workspace_enabled: 保存宿主运行记录到用户 runs/日期/不透明ID；普通聊天不建运行，记录不改变工具 cwd。
home_context_enabled: true
# 召回的 lesson 超过多少天未更新就附加"记忆可能过期"提示；0 表示不加提示。
# 防止把陈旧记忆当现状：记忆反映写入时的事实，与当前代码/状态冲突时以现状为准。
home_lesson_stale_caveat_days: 7
# 是否把每次运行的记录按日期归档成运行工作区。
# 一般不用改；只有当你希望自己的空间完全不留下任何运行归档时才需要关掉它，关掉后代理照常工作、工具的工作目录也不变，只是不再保留这些记录和索引。
run_task_workspace_enabled: true

# 用户业务文件的整理建议（由 home_context_enabled 控制提示加载）：
# - {date} 表示工作开始日期，{task_slug} 由模型概括“主题/对象 + 成果/动作”，不截取用户原话开头。
# - 用户指定名称优先；续作保留旧路径，重名检查仅涉及相关候选，不为取名额外调用模型或移动旧项目。
# - 模型根据用户需求自行创建目录；旧工作沿用已有位置，用户明确指定的路径优先。
# - 仅为软提示，不用于权限判断、运行状态或路径重写。主代理与普通子代理都可使用自己完整的家。
# - 宿主运行记录单独留在 runs/，不自动占用或移动用户 tasks/ 中的文件，也不额外调用模型取目录名。
workspace_task_path_template: "tasks/{date}/{task_slug}"

# 模型后端：留空表示尚未配置，不预选任何供应商或模型。
# 打开 /model 新增并选择模型后才可工作；echo 仅在显式选择时用于本地离线调试。
# - echo: 本地离线调试
# - openai_compatible: 走 /chat/completions
# - anthropic_compatible: 走 /v1/messages
model_backend: ""
# 也支持 openai_compatible（Chat）或 openai_responses（Responses）；Auth 尚未实现。

# 记忆文件路径：JSONL 格式，每行一条记录
memory_path: ""

# 本地事实源（第一版）：SQLite + FTS5 + 文件系统 + JSONL
# - SQLite: 保存结构化索引和审计事件，适合统计、过滤、恢复。
# - FTS5: SQLite 自带全文检索扩展，能用时就走本地全文搜索；不能用时自动退回 LIKE。
# - files: 正文和未来大 artifact 放文件系统，避免数据库过胖，也方便人工直接打开。
# - events.jsonl: 追加式流水账，方便排查“什么时候写了什么”，后续也适合上传同步。
# 普通用户不需要改这里；高级用户可以把这组路径放到独立数据盘或同步目录。
local_store_path: ""
# 本地记忆库里正文和大附件的存放目录。
# 这样正文放文件系统、数据库不会变胖，也方便你直接打开文件。
# 一般不需要改，只有你想把这些内容放到独立数据盘或指定目录时才需要设；留空则用运行目录下的默认位置。
# （安全边界：只能由用户在配置文件里改，模型不能改）
local_store_files_dir: ""
# 本地记忆库事件流水账文件的存放位置。
# 用来记录「什么时候写了什么」方便排查。
# 一般不需要改，只有你想把这份数据放到独立数据盘或指定目录时才需要设；留空则用运行目录下的默认位置。
# （安全边界：只能由用户在配置文件里改，模型不能改）
local_store_events_path: ""
# 本地记忆库是否启用全文检索（FTS5）：关闭后相关记忆的关键词召回退化为慢速扫描。
local_store_fts_enabled: true

# 每轮请求最多带多少条相关记忆进入 prompt
memory_top_k: 5

# 是否启用后台 Memory Curator（统一每日经历提炼服务）：关闭时保留现有游标和候选，不调用辅助模型。
memory_curator_enabled: true
# 后台记忆整理固定使用的模型档案编号（在 /model 列表查看）；留空沿用 owner 当前选中的模型。
# 指定时使用该档案自己的服务商凭据和端点，必须存在、启用且支持 agentic；失效明确失败，不回退到聊天模型。
# 这决定记忆内容发送给哪个服务商，属于安全边界：仅用户经 /settings 修改，模型不能改；重启 Gateway 后生效。
memory_curator_model_profile: ""
# 后台记忆整理隔多久自动触发一次（秒）。
# 想让记忆更及时沉淀就调小，想减少后台模型调用、省资源就调大；需要注意的是，光到时间还不够，期间必须有过新对话才会真的触发。
memory_curator_interval_seconds: 10800
# 后台记忆整理按对话轮数触发的门槛。
# 新对话累计到这么多用户轮次，就会整理一次记忆，不必等时间间隔。
# 想让记忆更及时可以调小，想减少后台调用就调大；设为最小的 1 表示几乎每轮都会触发。
memory_curator_turn_threshold: 10
# 后台记忆整理单次交给提炼模型的对话与日志字符数上限。
# 单次需要沉淀的内容特别多（例如长文档批量导入）时可以调大，让一批装得下更多；想省模型费用、或希望单次失败影响小一些就调小。
memory_curator_max_input_chars: 40000
# 后台记忆整理调用模型的基础超时秒数。
# 输入越长，程序会自动按比例放宽等待时间，所以短输入按这个值走即可，长输入不用手动改；只有你的整理模型特别慢、经常超时失败时，才需要调大。
memory_curator_timeout_seconds: 90
# 后台记忆整理最多同时处理几个任务。
# 按用户空间分配名额，超出的整理任务排队留到下一轮再处理，不会抢占主会话。
# 只有在后台整理明显积压、或你希望主动限制它占用的资源时才需要改。
memory_curator_workers: 2
# 后台策展每天在 owner 当地时间的几点做每日收尾，取值 0-23。
memory_curator_daily_finalize_hour: 23
# 后台记忆整理时是否自动晋升够格的候选记忆。
# 如果你希望所有候选都等自己人工确认、不让程序自动写入长期记忆，就把它改成 `manual_only`；取值 `conservative_v1` 表示只自动晋升证据精确、没有冲突的新长期事实。
memory_curator_auto_promotion_policy: "conservative_v1"
# 普通教训晋升为长期记忆所需的最少独立观察次数。
memory_lesson_min_occurrences: 2
# 已接受的教训晋升为 HOT 热点教训所需的最少独立观察次数。
memory_hot_min_occurrences: 3

# 是否自动持久化运行归档、恢复事实和 task workspace。
# 该字段不把普通 user/assistant 正文写入正式 long_term；完整对话由 ConversationStore 掌权，
# Daily/Candidate 只由统一 Memory Curator 生成。
auto_save_memory: true
# 记忆语义召回（检索拓宽 #1，默认 false=现状纯关键词）：开后记忆召回在关键词外加一路语义向量召回、
# RRF 融合，治"换词就召不回"。向量只存各 owner 自己 home 本地文件（零依赖、不碰共享向量库、按用户隔离）。
# 需配嵌入服务 embedding_model_profile（见“嵌入服务”一节，与工具语义检索共用）；没配自动只走关键词，不崩不退化。
memory_semantic_recall: false

# Memory 新架构安全配置（第一版骨架）：
# - 这些字段先定义“开关、等级、保留天数和规则路由模式”，具体 hook/routing 业务后续再接。
# - 如果用户乱填 abcd、乱码、脚本片段、负数或越界数字，程序会自动回到默认值，不会崩溃。
# - memory_rule_auto_read_limit 表示每轮最多自动读取多少条规则正文；0 表示不自动读取。
# - compact 提前提示优先读取当前模型后端暴露的真实上下文窗口；拿不到时按 128K 估算（见 model_context_window_tokens）。
# - memory_compact_auto_trigger_percent 控制上下文使用到多少百分比时自动 compact：
#   不写默认 90；0 表示 100；乱填回默认；大于100 => 100；小于50 => 50；50-100 => 按填写值。
#   经 user_config 自助修改时只接受 50-100，恢复目标只接受 25-80，绝对上限接受 0 或正整数，与运行时一致，接受的值一定原样生效。
# - memory_compact_auto_trigger_max_tokens 是触发线的绝对 token 上限，与上面的百分比取小；默认 300000，0 表示不封顶。
# - memory_compact_recovery_target_percent 控制 compact 后的健康目标：默认 60，范围 25-80；
#   运行时会优先收敛到“触发线 - 一段完整近期尾部预算”以内；若固定提示/工具上下文使该目标不可达，
#   但候选已经低于真实触发线，仍提交这一代，避免慢模型反复生成并丢弃同一份有效摘要。
# - 主代理、子代理和手动 /compact 都显示真实生命周期动画；阶段间只转圈，不按等待时间虚构百分比。
# - 保存型运行默认执行非破坏性 apply + auto resume + guard；save=false 时只生成计划，不写入 compact apply。
# - 自动 compact 续接有绝对深度硬顶（内部具名常量，不再暴露为配置项，防无限续跑 H2）；未达硬顶时只要 compact 包可恢复就继续同一任务，不会因普通任务缺少验收/测试备注而停车。
# - 运行中 raw archive 和 runtime_fact 是 compact/resume 的基础事实源，随持久化运行默认启用，不提供单独关闭开关。

# 会话存档记多细（0-3，默认 3）：每次运行结束、子代理收尾时都按这一个级别存档，供以后恢复和回查。
# 3 = 只存最小恢复快照（最省磁盘，一般就用它）；2 = 摘要加关键事件；1 = 去掉大块工具展示数据；0 = 尽量全量。
# 只有排查问题需要更完整的历史时才调小；乱填会退回 3。
memory_archive_level: 3
# 子代理运行失败时是否自动留一份恢复快照。
# 它用于事后排查和恢复任务上下文。
# 如果你不希望这类快照占用磁盘，可以关掉；但关掉后子代理失败时就少了一份可回查的现场记录，后台归档与对话记录不受这个开关影响。
memory_hook_enabled: true
# 长期规则（教训）怎么用，默认 soft，一般不用改：
# - soft：问题命中规则索引时提醒模型，并自动读少量规则正文（条数见 memory_rule_auto_read_limit）。
# - strict：命中的规则必须先读原文件再动手，适合规则很关键、必须照做的场景。
# - off：完全不做规则路由（旧键 memory_rule_routing_enabled: false 就等于这里写 off）。
memory_rule_routing_mode: "soft"
# 每轮最多自动读取几条长期规则或教训的正文。
# 规则很多、上下文容易被占满时可以调小，希望模型拿到更多规则细节时可以调大；设为 0 表示完全不自动读取正文，只保留命中的提示。
memory_rule_auto_read_limit: 3
# 要不要自动往本轮提示里加“恢复线索”（以前运行的归档和任务事实），默认 off：
# - off：不自动加（默认），普通对话不会因为恢复检索变慢。
# - trigger：只在消息里带 run/request/subagent/gwreq 这类结构化编号时才加；“继续、上次”这类说法不触发。
# - always：每轮都尝试加，适合专门做恢复/排障的会话。
# 偶尔需要时单次运行加 --resume-context 就行，不用改这里。
memory_resume_auto_context_mode: "off"
# 自动压缩对话上下文的触发线：用到这个程度就整理一次，把较早内容压成摘要。
# 数字调小会压缩得更早、保留的原文更少，调大则更晚压缩、更容易顶到上限；如果你的对话经常被压缩打断，可以调大一点。
memory_compact_auto_trigger_percent: 90
# 自动压缩触发线的绝对上限（单位 tokens），和上面的百分比取小：实际触发线 = min(模型窗口 × 百分比, 这个数)。
# 默认 0 表示不封顶，行为和以前完全一样。模型窗口很大（比如 1M）时百分比最低也只能压到 50%（50 万），
# 长期运行的后台线程会在几十万 token 之间跑很久才压缩，几个线程并发时容易顶住服务商的每分钟 token 上限；
# 这种情况可以填一个绝对值（例如 250000）让压缩提前发生；压缩后的健康目标按同样比例下调（触发线 × 恢复百分比 ÷ 触发百分比，
# 30 万时是 20 万）。填的值不低于“模型窗口 × 百分比”时不起作用。改完需要重启 Gateway 才生效。
# 默认 300000：窗口 33 万以下的模型按百分比先触发，不受影响；1M 级窗口不再拖到约 90 万才压缩（09-29 429 事故的形状）。
# 显式写 0 表示不封顶；乱填、负数会回到默认 300000。
memory_compact_auto_trigger_max_tokens: 300000
# 上下文用量校准比值跨会话沿用（默认开）。状态条的 Context 数字和自动压缩判断，都会用服务商真实用量去校准本地估算；
# 这份校准原本只在同一个会话里有效，新开的会话、换过模型的会话、刚压缩完的第一次调用只能用本地估算，常常偏高两三成。
# 开着时，每次模型调用成功后把“同一个模型的估算 / 实际”比值记在 owner 目录 data/context/calibration.json（只有数字，最多 32 条），
# 这些场景的第一次调用就按这个比值折算（最多折到一半）。关掉就不读也不写这个文件，回到只用会话内校准。
memory_context_calibration_carry_enabled: true
# 自动压缩后的历史收缩目标百分比。
# 只有当你的模型窗口特别大、或压缩后仍频繁再次触发压缩时，才需要调低它压得更狠；调高会更保守、保留更多历史，但可能很快又触发下一次压缩。
memory_compact_recovery_target_percent: 60
# compact 自动续跑深度硬顶已降为代码常量（finalization_compact_auto._DEFAULT_MAX_COMPACT_AUTO_CONTINUE_DEPTH，2026-09-28 参数减量）。
# compact 续跑时对卸掉的“中段历史”做一次 LLM 语义摘要：
# - 续跑靠 carried archive 记录逐条重建工具历史；默认会对中段记录调一次摘要模型，用一条语义摘要
#   折叠中段、原样保留首尾，把机械截断换成“这段做了什么/学到什么”的叙述，长任务续跑少丢上下文。
# - 这是纯增强：不碰 raw archive / runtime_fact / work_state / artifact 等事实源。text 协议读取该投影；
#   native 跨进程续跑把它装成一条 CompactionSummary handoff，不伪造旧工具对、不推进 compact generation。
# - enabled=false 完全关闭（走纯机械重建）；摘要异常、供应商超时或无可用后端时静默回退机械重建。
# - 不再另起一个无法取消的摘要线程计时器；慢模型沿用统一模型传输的首包和流空闲超时。
memory_compact_semantic_summary_enabled: true

# 含图片/视频历史的压缩策略（设计见 docs/design/COMPACT_MEDIA_POLICY.md）：
# - auto：默认。旧附件在压缩时降级为"[附件引用 sha256 前缀 / 文件名 / 大小]"文字块，只摘要文字；
#   模型视觉能力事实（档案声明或结构化探针）接入后，支持视觉的模型才会把含图轮次随图摘要。
# - archived_refs：固定走归档引用，不探针、不随图摘要。
# - off：保持旧行为——从首个媒体回合起保护全部后缀不摘要，会话容量等于窗口减去图片之后的全部内容。
# 附件原件与 canonical 历史在任何策略下都不删；需要重看旧图时重新添加同一附件即可。
# 视觉能力事实只来自两处：模型档案的输入模态声明（/model 表单"输入模态"，运行时为 model_input_modalities），
# 或未声明时宿主发起的一次结构化探针（8×8 纯色图 + 结构化工具回答，进程内缓存）；模型口头说"能看图"无效。
compact_media_policy: "auto"
# 压缩摘要末尾的“原话备份”（Exact Conversation Landmarks）最多占多少 token：
# - 用户原话优先、最新优先，放不下的那条保留开头和结尾、截掉中间并写明原长度，每条都带消息编号；
# - 实际上限取本值与模型窗口 10% 中较小者（最少 500），窗口越大能留的原话越多；
# - 放不下的用户消息编号列在备份段末尾，模型可用 session_search 按编号读回全文；
# - 候选超出压缩恢复目标时会自动缩小备份，不会因为备份让压缩失败；
# - 0 表示不附原话，只保留被省略消息的编号与回查说明。
compact_landmark_max_tokens: 20000
# 压缩摘要末尾是否附“原文回查说明”：被压缩的原话仍完整保存在会话记录里，模型可用
# session_search(message_id=..., offset=...) 分段读回，或 current_thread=true 在本会话内检索/浏览。
# 只在本 agent 注册了 session_search 时附上；关闭后只是不提示，session_search 本身照常可用。
compact_recall_hint_enabled: true

# 沙箱额外可写根（任务 work/output 之外），全局配置、对所有用户生效；测试共享工作区等场景配置。属于安全边界，模型不能改。
additional_write_roots: []
# 额外动态 prompt 文件：构建提示词时按顺序读取并拼进系统提示，builtin: 前缀指随包内置文件；隔离范围的子代理不读。
# 会改变代理的指令，属于安全边界，模型不能改。
prompt_files:
  - "builtin:prompts/default.md"

# my-agent 改自己代码用的开发工作树（git 工作树的绝对路径，建议独立分支）。
# 只在本机管理员开启 Full Access 时写进提示词：说明正在运行的代码在哪（只读参考），用户要它改自身功能或修 bug 时
# 去这个目录改、跑测试、提交到该分支，由集成者审核合并部署。目录不存在或不是 git 工作树时不写。
# 空表示不启用，提示词不变。这只是工作约定，不额外授予写权限（写权限仍看 Full Access）。
self_dev_worktree: ""

# 保护正在运行的 my-agent 安装目录：开启时任何代理、任何模式（包括 Full Access）的文件工具与命令都不能写它，
# 部署是唯一的更新方式。安装目录按进程事实认定：在虚拟环境里运行就保护整个环境；装在系统 site-packages 时只保护
# agent 包目录；从源码检出直接运行时不保护。只在调试安装本身时才关闭。
protect_running_runtime: true

# 子代理配置
# - 子代理默认应该像“不同职责的主代理”一样能独立干活。
# - 角色模板只追加职责，不应该拿掉基础读写、汇报和任务目录内执行能力。
enable_subagents: true

# 同一根会话树同时最多保留多少个未结束子代理；不同 TUI/根任务互不占槽。
# 对照 会话运行时 AgentControl：容量属于 root session，不由 owner 历史账本全局占用。
# 默认允许按 8 个独立职责一次铺开；终态 child 释放槽位，历史累计数量可以超过 8。
max_subagents: 8
# 可选的更严格当前任务上限；0 表示不在 max_subagents 之外再收紧。
task_max_subagents: 0

# 子代理运行账本目录。
# - 默认空值表示写入当前 owner home 的工作区运行目录。
# - 用户明确填写路径时，按填写路径落盘。
subagent_workspace: ""
# 配置层给子代理预设的可用工具清单。
# 用来收窄子代理能用的工具范围。
# 一般留空即可，只有你想统一限制所有子代理只能用某几类工具时才需要填；留空或空列表表示不在配置层额外限制（运行时和预设仍会各自收口）。
# 填写时可以写成一串用逗号分隔的工具名，也可以写成列表。
# （安全边界：只能由用户在配置文件里改，模型不能改）
subagent_allowed_tools: []

# 子代理角色模板目录。
# - [] 表示自动使用工作区 .agent/subagents/roles（如果存在）+ 内置模板。
# - 模板只影响职责和检查重点，不应让代理失去基础读写/汇报能力。
subagent_role_template_dirs: []
# 0 表示不再设置一份重复的“单次创建”默认上限；实际批量仍受 max_subagents 可用槽位约束。
# 部署方若要更小批次，可显式填写正整数。
subagent_hierarchy_max_children_per_tool_call: 0
# 一个运行被接管产生的链条最多能有多深。
# 到达上限后系统会拒绝再创建新的接管运行。
# 平时不用改；只有当你担心自动接管会一直往下套、想强制收口时才需要设一个正数。
# 填 `0` 表示不设深度上限，也就是允许一直接管下去。
subagent_takeover_chain_max_depth: 0

# 子代理调试追踪等级。
# - 0: 默认关闭
# - 1-2: 记录生命周期、调度、验收等 refs-only 信息
# - 3-5: 逐步增加 prompt/tool/response 预览或完整细节，建议只在真实 E2E 排障时开启
subagent_debug_trace_level: 0

# 自学习（默认关闭）：
# - false：不自动总结 Skill；子代理的 lesson 只进入统一记忆候选账本，不生成任何 Skill 提案，也不创建提案目录。
# - true：
#   1. 主代理正常完成、且本轮工具轮数达到 self_learning_min_tool_rounds 的任务，会在 owner 的 data/skill_learning/
#      下登记一条有界学习请求；Gateway 后台记忆整理车道用 owner 当前选定的模型判断是否值得沉淀，
#      值得就新建或更新 owner 的 skills/learned/<名字>/SKILL.md，下一轮自动可用。
#   2. 不需要用户逐条确认：发布前必须通过自动闸门（输出格式、重名、数量上限、只改自己生成且用户没改过的 Skill、
#      解析检查、明文密钥检查、安全扫描）；每次写入都记账并保存版本，可用
#      `my-agent skills learned list/show/revert/remove` 查看、回滚或删除（删除后同名不再自动新建）。
#   3. 带精确任务/运行来源的子代理 lesson 生成的 Skill 提案会立即走原确认链自动安装（回执标 confirmed_by=auto）；
#      以前遗留的待确认提案仍可用 `my-agent skills proposals list/show/confirm/reject` 管理。
# - 会额外消耗模型调用（受下面每日上限约束），并写 owner 的 skills 目录。
enable_self_learning: false

# 自动总结 Skill 的触发与预算（只在 enable_self_learning 为 true 时生效）：
# - self_learning_min_tool_rounds：本轮工具轮数达到它才登记学习请求，最小 1。
# - self_learning_daily_limit：每个 owner 每天最多发几次总结调用；0 表示不限。
# - self_learning_max_skills：自动总结最多保留几个 Skill（只限制新建，更新不受限）；0 表示不限。
# - self_learning_timeout_seconds：单次总结调用的超时秒数，最小 10。
self_learning_min_tool_rounds: 6
# 每天最多自动把任务总结成技能的模型调用次数。
# 只有当你嫌它太费模型调用、或反过来觉得总结不够及时想放宽时才需要改。
# 填 `0` 表示不限次数。
self_learning_daily_limit: 20
# 自动总结最多能新建出的自学技能数量上限。
# 只有当你希望给自学技能的总数设个天花板、不让它无限增长时才需要改。
# 填 `0` 表示不限；它只管新建、不算更新，已有技能的更新不受这个数影响。
self_learning_max_skills: 50
# 自动总结时单次调用模型最多等多少秒。
# 超过就按这次调用失败处理。
# 只有当你用的模型特别慢、总结经常卡到超时，或反过来想让它更快放弃时才需要调整，并且不能设得比最小允许值更低。
self_learning_timeout_seconds: 180

# 代理自助管理模型目录（默认开启）：
# - true：主会话代理可用 manage_models 工具代替用户列出、新增、编辑、删除服务商和模型，切换当前会话或新会话默认模型，
#   并做连通性测试；密钥只作为工具参数传一次，回执、归档和日志都不回显。删除服务商会经统一危险动作审批门，
#   其余动作按当前 owner 的审批模式裁决；子代理运行里该工具不可用。
# - false：不注册该工具，模型目录只能通过 TUI /model 手动维护。
enable_model_profile_tool: true

# 代理自助安排 Gateway 安全重启（默认开启）：
# - true：本机管理员的主会话代理可用 restart_gateway 工具安排重启。Gateway 先停领新请求、等在跑的回合结束，
#   再让新的副作用工具停在开跑前、等执行中的工具跑完，然后换一个新进程接班；停在半路的回合由新进程自动续跑，
#   重启完成后会给发起的会话发一条“重启已完成、不要再次重启”的通知。普通用户和群的代理没有这个工具。
#   是否需要你确认由审批模式决定：完全放行（full access）时直接执行，其它模式按危险动作审批。
# - false：不注册该工具；需要重启时由管理员在终端执行 my-agent gateway restart 或使用 /restart。
enable_gateway_restart_tool: true

# TUI 随 Gateway 升级原地切换（默认开启）：
# - true：部署新版 Gateway 后，正在运行的 TUI 每隔几秒读一次 Gateway 状态文件里的 runtime_prefix；发现与自己不是同一安装，
#   且当前没有进行中的回合、没有排队、没有待审批、输入框为空、没在看菜单/翻历史/看子代理时，在同一个终端里原地换成
#   Gateway 同版的 my-agent：屏幕不退出、不闪回 shell，底部先显示“正在切换到新版本…”，约一两秒后以同一段对话继续，
#   期间按下的键不会丢。正在忙时只在底部提示，等空闲再切。Windows 不支持原地切换，只提示重开。
# - false：只提示，不自动切换（开发时从源码 venv 起 TUI 对着已部署 Gateway 调试可关掉）。
tui_follow_gateway_upgrade: true

# 用户身份配置
# - user_id: 当前本地用户标识，默认为 admin
user_id: "admin"

# 多租户鉴权配置
# - auth_enabled: 是否启用鉴权，默认开启；关闭后所有人都有 admin 权限（方便本地开发）
# - admin_user_id: 管理员用户 ID，外部通道携带此 user_id 时也获得 admin 权限
auth_enabled: true
# 外部通道里被当作管理员的那个用户 ID。
# 只有当你希望某个人在外部通道里也拥有管理员权限时，才需要改成那个人的用户 ID；留空会回落到内置的默认用户名。
# （安全边界：只能由用户在配置文件里改，模型不能改）
admin_user_id: "admin"

# 安全检查里一个技能目录最多允许放多少个文件的上限。
# 超过就会被标记出来提醒你。
# 只有当你确实要收录文件数很多的技能时才需要调大。
# 填 `0` 表示不设这个文件数上限。
skill_guard_max_files: 50
# 安全检查里一个技能目录总体积最多多大的上限。
# 按目录内所有文件加总计算，超过就会被标记出来提醒你。
# 只有当你确实要收录体积较大的技能时才需要调大。
# 填 `0` 表示不设这个体积上限。
skill_guard_max_size_kb: 1024

# 子代理干活时出了临时问题（runner 出错或超时、输出格式解析失败、工具结果丢失、模型服务出错或超时）失败后，
# 最多自动重跑几次，默认 1：
# - 0 = 不自动重跑，失败后直接交给父代理决定；想多给几次机会就调大。
# - 能力缺口、验收没过、通道断开这类问题不会自动重跑。
# - 模型服务限流、断供这类临时供应问题另有更宽的重跑上限，不会因为这里设得小就被卡死。
runner_failure_retry_limit: 1
# 一次派工最多同时跑几个子代理，默认 auto = 8（和一个会话最多 8 个子代理对齐）：
# - 写数字 = 最多同时跑这么多个，其余排队；0 = 不限制，这一批有多少就同时跑多少。
# - 子代理、孙代理等各层都算在这一个上限里。机器或模型额度吃紧时调小，一般不用改。
runner_concurrency: "auto"
# 一次派工最多同时新启动几个后台子任务，已经在跑的也占名额。
# `auto` 表示有多少任务就启动多少，`0` 表示不限制；机器资源紧张时才需要改成具体数字。
runner_start_rate: "auto"
# create_subagents 会由宿主自动启动并恢复 runner，模型不轮询或手动推进。
# runner_start_rate 只限制每个调度切片启动多少个，剩余项由后台继续启动并以生命周期事件通知直接父级。

# runner_timeout_seconds 控制单个 runner 的外层总时长保护：
# - "off": 默认，不套外层总时长闹钟；长任务靠心跳、状态、取消/接管工具治理。
# - "auto": 按任务文本和角色动态计算超时，适合压测或需要自动抢救卡死 runner 的场景。
# - "120" 这类数字字符串：固定 120 秒。
runner_timeout_seconds: "off"
# 给不同角色的运行分别设定最长允许跑多久的对照表。
# 平时不用填；只有当某一类角色（比如 root 或某个 worker 角色）经常跑太久，你想单独给它一个时限或干脆关掉时限时才需要设置。
# 留空表示不给任何角色单独设限，所有运行统一听 runner_timeout_seconds；某一角色可以填秒数、填 `off` 表示这一角色不限制时长、填 `auto` 表示交回系统自动判断。
runner_timeout_by_role: []

# 主会话后台命令结束后主动通知，复用持久唤醒队列；关闭不影响 process_session 查询/长等待。
background_process_notifications: true
# 自动估算请求超时时允许的最小值（秒）；避免把超时压得太短、请求还没发完就中断。
dynamic_timeout_min: 30
# 自动估算请求超时时允许的最大值（秒）。
# 只有合法任务确实需要跑更久、却被超时打断时才需要调大。
dynamic_timeout_max: 10800
# 没有足够实测 probe 样本时输出吞吐的保守估计（token/s）：只决定非流式请求总预算；流式输出只受滚动 idle 和显式 /stop 约束。
# 预填充吞吐（200 token/s）、安全边际（2.0）与 probe 统计参数已是代码常量（agent_core/dynamic_timeout、model/call_monitor）。
# 20 与 10800 秒上限可覆盖极慢场景；小请求仍按真实 token 估算，不会一律等待 3 小时。
estimated_output_tokens_per_second: 20.0
# 「模型速度画像」文件的路径。
# my-agent 用其中的实测速度数据来估算每次请求该给多长超时。
# 一般不需要改，只有你手上有自定义的速度画像文件、或想让它固定指向某一份数据时才设；留空则用缓存目录下的默认位置并回退到内置的经验估算。
# （安全边界：只能由用户在配置文件里改，模型不能改）
model_speed_profile_path: ""

# Gateway 本地控制面（第一版）：
# - gateway 是后台常驻外壳，chat/TUI 后续会作为客户端 attach。
# - 第一版先用本地文件管理状态：pid、heartbeat、state、stop request 和日志。
# - 调整这些配置后，重启 gateway 即可生效；任务状态仍保存在 subagent/task 账本里。
# - 留空时固定落在 owner workspace/runtime/services/gateway；多个不同 cwd 的 TUI 共用这一处。
# - 显式绝对路径原样使用；显式相对路径以 owner workspace 解析，不以启动 TUI 的 cwd 解析。
gateway_workspace: ""
# 停止后台服务时最多等它多久自己退出，超时就强制结束。
# 任务都跑得比较久、希望停止时更温和，可以调大。
gateway_stop_timeout: 20

# gateway 本地消息入口。
# 这几个配置控制 `my-agent gateway ask/result` 这一层。
# 当前还没有 HTTP/WebSocket 服务，先用本地文件队列：
# - requests/pending：新请求，相当于收件箱。
# - requests/processing：gateway 正在处理的请求；如果进程崩溃，重启会退回 pending。
# - requests/done：处理完的请求原件，方便排查。
# - responses：模型响应，`gateway result <request_id>` 读取这里。
# - gateway_requests.jsonl：一行一条审计日志。
# gateway_request_timeout 是 CLI 等待结果的默认时长，单位秒；交互 chat
# 把它作为连续无请求租约/流式活动的等待窗；TUI 超窗仅提示并继续观察同一请求，
# 页面退出只停止本地观察，不取消服务端任务。plain/一次性等待仍在超窗时返回。
gateway_request_timeout: 300
# gateway ask 两层限流：
# - gateway_user_inflight_limit：每用户同时在飞上限（"小坑"，防一个用户独吞把别人饿死）。
# - gateway_global_inflight_limit：全局同时在飞上限（"大坑"，高天花板；超出的留在 pending
#   排队，不拒不崩）。两个都是先设的限制值（不是吞吐目标），按机器/模型承载力调。
# - gateway_processing_timeout_seconds 用来判断 processing 请求是否已经卡死。
# - gateway_request_max_attempts：processing 租约实际卡死的累计失败上限，默认 2 即首次重排、再次卡死归档 failed。
#   服务重启接续同一回合不占失败次数；旧 attempts 只记执行代次。0 表示不卡死次数上限，未知副作用门不放宽。
gateway_user_inflight_limit: 8
# 后台服务同时最多处理多少个请求（所有会话加在一起）。
# 一般远远用不到；只有在同一台机器上跑很多并发任务、或想限制资源占用时才需要调小。
gateway_global_inflight_limit: 500
# 一个请求开始处理之后，超过这个秒数还没结束就认为它卡住了（可以被重新安排）。
# 正常请求远快于此；如果你有跑很久的合法任务被误判成卡住，可以调大。
gateway_processing_timeout_seconds: 900
# 一个请求失败后最多尝试几次（含第一次）。
# 上游不稳定时可以调大，但重试也会消耗用量。
gateway_request_max_attempts: 2
# 后台会话全局线程池上限；不同 owner 和不同 thread 都可并发，同 thread
# 仍由持久 run claim 保证单飞。超出的会话留在持久队列，不丢弃。
background_owner_workers: 8
# 同一 owner 最多同时跑几个不同会话的后台回合。默认 4 能覆盖多 TUI，
# 同时防止一个用户用大量历史会话占满全局模型池；调大会增加并发模型请求。
background_threads_per_owner: 4
# per-owner 作用域 agent 实例池上限（有界 LRU，超出逐出最久未用）。多用户高并发时按
# 常驻活跃用户数调；每个实例含独立 home/记忆/local_store 句柄。
owner_agent_pool_max_agents: 64
# 用户实例连续空闲多久后释放（秒，0=关闭）；在途执行或持久任务/唤醒仍保留。
# 身份、会话、记忆保存在磁盘；新消息按需重建。被动状态轮询不延长空闲时间。
owner_agent_idle_seconds: 60.0
# 用户显式添加的图片/视频：单条消息原始附件总字节上限与数量上限。
# 历史仅保存引用；同一字节上限也约束每次模型请求，较旧附件超预算时只发归档引用。
# 模型和接口仍须支持对应模态，不自动换模型。
input_media_max_bytes: 16777216
# 一条消息里最多能带几个图片或视频附件（TUI 里 `/attach` 或拖入）。
# 一般不用改；单个文件的大小上限另由 input_media_max_bytes 控制。
input_media_max_files: 8
# owner retention 后台扫描间隔（秒，0=关）：每拍只扫 owner_agent_pool_max_agents 个
# 规范 owner home；每个 owner 仍由 retention.json 的 maintenance_interval_seconds 日级节流。
# 该控制器只读结构化状态并执行清理，不创建 Agent、不调用 LLM。
owner_maintenance_scan_interval_seconds: 60
# CLI/TUI 等待 Gateway 就绪的最长秒数。TUI 会先显示连接状态再后台探测；默认 3 秒，
# 避免 Gateway 未启动时让用户面对长时间空白或无响应。
gateway_ready_timeout_seconds: 3
# Gateway 安全重启（restart_gateway 工具、/restart）：
# - gateway_restart_turn_wait_seconds：第一段，停领新请求后等在跑回合结束的上限秒数；超时后进入第二段，
#   回合停在下一个副作用工具之前，由接班进程续跑。0 表示不等回合、直接进入第二段。
# - gateway_restart_drain_timeout_seconds：第二段，等执行中的副作用工具跑完的上限秒数，0 表示不限；
#   超时就取消这次重启、恢复正常服务，不强杀任何工具。
# - gateway_restart_cooldown_seconds：两次安全重启之间的最短间隔秒数，0 表示不限。
#   另有固定防循环：同一会话 10 分钟内最多安排 3 次重启。
gateway_restart_turn_wait_seconds: 300
# 重启后台服务时最多等正在跑的任务多久，超过就先强制收尾。
# 长任务多、希望重启更温和时可以调大。
gateway_restart_drain_timeout_seconds: 600
# 两次安全重启 Gateway 之间必须间隔的最少秒数。
# 用来防止反复重启形成死循环；冷却期内提交的重启请求会被直接拒绝并提示正在冷却。
# 只有你觉得重启太频繁或希望更快地连续重启时才需要调整；写成 `0` 表示不设冷却间隔。
# （安全边界：只能由用户在配置文件里改，模型不能改）
gateway_restart_cooldown_seconds: 30

# HTTP 服务端口（gateway 守护进程用）
# - 默认 8420
# - 设置为 0 则禁用 HTTP 服务
gateway_port: 8420
# 多用户通道默认按每条请求的用户/channel 解析 owner，在该用户作用域的 agent（独立
# home/记忆/数据/成本/审计）上跑。远程通道身份缺失或 owner agent 创建失败时拒绝请求，
# 绝不回退到基础 agent 串户；本机 CLI 没有远程身份时仍走 local main owner。
gateway_per_user_owner_scoping: true
# IM 管理员身份：本机用 `my-agent admin-password set` 设置管理员密码后，管理员在飞书等 IM 与机器人的一对一私聊里
# 发送 `/admin <密码>` 即把该私聊身份（渠道+用户ID 精确匹配）绑定为管理员：之后这个私聊按本机主用户 local/main 运行，
# 需要确认的工具会在聊天里提示，回复 `/approve <密码>` 批准本次、`/deny` 拒绝。群聊永远不匹配。
# 没设密码时不会有任何绑定；设为 false 时 /admin 拒绝，已有绑定不生效（文件保留）。只在 base owner 为 local/main 时可用。
admin_channel_identity_enabled: true

# 网关 HTTP 绑定地址。默认 127.0.0.1(仅本机可达)。
# 改成 0.0.0.0 等非回环地址会把网关暴露到网络,此时必须 auth_enabled=true,否则 fail-closed 拒绝启动
# (防"绑 0.0.0.0 + 无鉴权 = 任意网络客户端被当 admin 驱动 agent")。
gateway_bind_host: "127.0.0.1"

# 网关局部信任 token(暴露部署用)。默认空 = 只靠回环来源信任(本机适配器/CLI 走 127.0.0.1)。
# 非空时,非回环来源的请求必须携带匹配的 X-Gateway-Token 头才被信任(否则降为匿名 USER、绝不 admin)。
gateway_auth_token: ""

# 外部聊天工具 / TUI 文件适配器工作区。
# 第一版 adapter file 会从 inbox 读 JSON 消息，把结果写到 outbox。
# 留空时固定落在 owner workspace/runtime/services/adapters/file；相对覆盖同样以 owner workspace 解析。
adapter_workspace: ""

# 飞书（Lark）通道适配器配置
# - feishu_app_id / feishu_app_secret: 飞书应用凭证，从环境变量或配置文件读取
# - feishu_verification_token: 飞书回调地址配置时的验证 token
# - feishu_encrypt_key: 飞书消息加密 key（可选）
# - feishu_callback_port: 本地 HTTP 回调服务端口，飞书会往这个地址推送事件
# - feishu_connection_mode: long_connection(默认,支持交互卡片且免公网) / webhook(需公网回调地址)
# - feishu_ws_proxy: 长连可选代理(空=走 HTTPS_PROXY 环境变量;TUN/代理环境直连飞书 WS 网关是黑洞,需显式填代理)
feishu_app_id: ""
# 飞书自建应用的 App Secret，用于以你的飞书应用身份收发消息。
# 在飞书开放平台（开发者后台）的「凭证与基础信息」里获取。
# 只有首次接入飞书或更换应用时才需要填；可以写明文，也可以写成 `env:变量名` 或 `file:路径` 的间接引用，避免明文落到配置文件里。
# （安全边界：只能由用户在配置文件里改，模型不能改）
feishu_app_secret: ""
# 飞书事件订阅的校验令牌（Verification Token）。
# 在飞书开放平台「事件订阅」配置里获取。
# 主要在 webhook 回调模式下用到；支持写成 `env:变量名` 或 `file:路径` 的间接引用，避免明文进配置文件。
# （安全边界：只能由用户在配置文件里改，模型不能改）
feishu_verification_token: ""
# 飞书事件订阅的 Encrypt Key，用来校验并解密飞书推来的事件内容。
# 只有你在飞书那边开启了加密回调时才需要填（可选）。
# 在飞书开放平台「事件订阅」配置里获取。
# 支持写成 `env:变量名` 或 `file:路径` 的间接引用，避免明文进配置文件。
# （安全边界：只能由用户在配置文件里改，模型不能改）
feishu_encrypt_key: ""
# 飞书 webhook（回调）模式下本地回调服务监听的端口。
# 飞书会把事件推到这个端口。
# 只有你选择用 webhook 方式接入飞书时才需要它；这个端口会让本机对外监听，请确认它对外可达并做好防护，改完需要重启 Gateway 才生效。
# （安全边界：只能由用户在配置文件里改，模型不能改）
feishu_callback_port: 8421
# 飞书机器人的接入方式：长连接或 webhook（本地回调服务）。
# 长连接不需要公网地址、也支持交互卡片；webhook 需要公网能访问的地址，并配合 feishu_callback_port、feishu_verification_token、
# feishu_encrypt_key 一起用。
# 除非你有公网域名并想走回调模式，否则保持长连接即可。
feishu_connection_mode: "long_connection"
# 飞书长连接模式（WebSocket）出站时走的代理地址。
# 只影响长连接、不影响 webhook 模式。
# 留空时沿用系统里 `HTTPS_PROXY` 一类的环境变量；在 TUN/代理环境下直连飞书 WS 网关不通时，需要在这里显式填代理地址。
# （安全边界：只能由用户在配置文件里改，模型不能改）
feishu_ws_proxy: ""
# 个人私聊会话锁：默认开启；首次私聊发设置卡但仍处理本条消息，设置后闲置 3 小时才要求解锁。
feishu_session_lock_enabled: true
# 个人私聊连续 3 小时没有用户新消息后锁定；群聊不锁。
feishu_personal_idle_lock_seconds: 10800

# QQ 机器人通道适配器配置
# - qq_app_id / qq_app_secret: QQ 机器人应用凭证
qq_app_id: ""
# QQ 机器人应用的 App Secret，用于以你的机器人身份收发消息。
# 在 QQ 开放平台（机器人后台）的应用凭证处获取。
# 只有首次接入 QQ 或更换机器人应用时才需要填；也可以写成 `env:变量名` 或 `file:路径` 的间接引用，避免明文进配置文件。
# （安全边界：只能由用户在配置文件里改，模型不能改）
qq_app_secret: ""

# 时区与周历（审计 #21，面向几十国用户按本地时区渲染日期/时间/本周范围）：
# - timezone: IANA 时区名（如 Asia/Shanghai、America/New_York、Europe/London）；留空=服务器本地时间。
#   也可用环境变量 AGENT_TIMEZONE 覆盖（优先级最高）。非法时区串只告警并回退，不会崩。
# - week_start: 周起始（monday/sunday/saturday）；美国/中东常用 sunday/saturday，影响“本周”范围计算。
timezone: ""
# 一周从星期几开始，影响我理解「本周」「这周」时算的日期范围。
# 可选 monday（周一）或 sunday（周日）；如果你习惯按周日开始算一周，就改成 sunday。
week_start: "monday"

# 会话工作区：
# - 会话持久化目录，存储 session.json、TUI 输入历史和会话级别的上下文文件
# - 每个会话对应一个目录：<session_workspace>/{session_id}/
# - session.json 包含会话元数据：session_id、user_id、created_at、updated_at、last_active_channel、metadata
# - TUI 输入历史固定写在对应会话目录，不写进项目工作区，避免污染源码搜索和项目产物
session_workspace: ""

# 长期主代理线程工作区：
# - 保存 ConversationThread、MessageLog、ChannelBinding、ThreadTaskLink 和 ProgressPolicy。
# - 这是后台主代理恢复/定时汇报/跨渠道继续上下文的机器账本。
# - 不保存真实飞书/微信凭证，也不要求用户按工程字段写任务 prompt。
conversation_workspace: ""

# 整份后台状态副本的总预算；0 才表示关闭总量约束。原始账本和产物不受影响。
background_context_max_total_tokens: 8000
# 后台会话（主代理被唤醒后继续干活）占着执行权的租约秒数，默认 90：
# - 运行中会自动续约，续约间隔按它自动推导（约为三分之一，90 秒时每 30 秒续一次），不用另配。
# - 进程意外退出后，最多过这么久别的进程才能接手这个会话。
# - 一般不用改；机器很慢、经常看到租约过期被接手时才调大。最小 1。
background_claim_ttl_seconds: 90
# CLI 续跑轮数护栏已降为代码常量（cli/resume_loop._RESUME_MAX_ROUNDS，2026-09-28 参数减量）。
# 后台主代理唤醒时允许看到和调用的控制工具。
# - 留空表示使用默认控制工具 profile，包含命令、后台进程与交互终端的完整操作入口。
# - 写了列表就只暴露列表里的工具；执行参数和 prompt 说明共用这一份。
# - 留空时续跑会按注册表事实并入当前已启用插件和 MCP 服务的工具，让主代理接着用前台用过的插件工具；
#   写了列表就只有列表里的名字，插件工具也要写完整工具名。
# - 这是唤醒场景的工具上限，不会给主代理或子代理额外提权。
background_main_agent_allowed_tools: []

# 多代理协作控制面工作区：
# - 保存通用 case/request/evidence/decision 账本。
# - 只保存轻量机器事实；大文件、日志、API 返回和截图必须用 evidence_refs 指向外部产物。
# - 不把日志分析、GitHub 研究、文档生成等任务写成内置专项模板。
collaboration_workspace: ""
# 协作请求自动唤醒 responder 的最大并发数。
# 普通 dispatch 仍按代码默认的每轮 runner 上限（DispatchRuntimePolicy，1 个）；只有已有 collaboration request
# 等待多个代理响应时，才按这个上限一次推进多个 responder，避免协作证据串行排队。
# 0 表示关闭自动放宽，完全按本轮 max_runners 执行。
collaboration_auto_dispatch_max_runners: 8

# 审计日志配置：
# - audit_enabled: 是否启用审计日志
# - audit_log_path: 审计日志存储路径
audit_enabled: true
# 审计日志落盘的目录或文件。
# 一般不需要改，只有你打算把审计记录单独放到另一块数据盘或独立目录时才需要设；留空则使用默认位置。
# 填入带扩展名的路径会当作单个日志文件，不带的则当作目录。
# （安全边界：只能由用户在配置文件里改，模型不能改）
audit_log_path: ""

# 前台 daemon（my-agent daemon，前台 watch 调度循环）只保留下面三个配置项；每轮间隔、每轮 runner 数、记录条数、循环次数、
# 能力卡数、planner 与探针开关、审核者标识都是代码常量（cli/daemon.py），单次启动用命令行参数覆盖。

# 前台 daemon 是否真正改写状态的开关。
# 开启时前台 daemon 允许真正改写状态；关闭时偏向只给建议、不落盘（类似 dry-run）。
# 只有当你确定要让后台调度执行真实改动、而不是每次先人工确认时才需要调整。
# 注意开启 `daemon_start_runners` 时必须同时允许改写状态；单次启动可以用命令行 `--apply` / `--dry-run` 覆盖。
# （安全边界：只能由用户在配置文件里改，模型不能改）
daemon_mutate_state: true
# 前台 daemon 是否会真正启动 runner 执行任务的开关。
# 开启时前台 daemon 会真正启动 runner 去执行任务；关闭时偏向只给建议、不实际执行。
# 只有你确定要让后台调度自动跑起来时才需要开启，且开启时必须同时允许改写状态（见 `daemon_mutate_state`），单次启动可以用命令行 `--start-runners` 覆盖。
# （安全边界：只能由用户在配置文件里改，模型不能改）
daemon_start_runners: true
# 前台 daemon 自动派发 runner 时附加在任务上的额外指令文本。
# 用来给每轮派发统一补充要求。
# 只有你想让后台自动派发的任务都带上同样的额外说明时才需要填；留空表示不附加任何指令；单次启动可以用命令行 `--instruction` 覆盖。
# （安全边界：只能由用户在配置文件里改，模型不能改）
daemon_runner_instruction: ""

# 审计来源采集 worker（/audit 保证档里负责采集来源的子代理）的时间上限，单位秒：
# 单次模型尝试最多跑这么久（实际按 60～900 秒夹取），即使普通 runner 超时关闭也照样分片；
# 同一值也是该 worker 租约文件的有效期（至少 30 秒），过期没续约就判定原 worker 已停、可以被接管。
lease_stale_without_heartbeat_seconds: 300

# 日志级别：重新加载配置后会应用到 agent_py_agent 包内 logger
log_level: "info"


# 唯一正式插件加载链（按列表顺序）：
# - entrypoint:<name>：从已安装包的 my_agent.plugins entry-point 组加载。
# - package.module:<attribute>：从管理员已安装的可导入模块加载插件对象或工厂。
# - 缺失、重复或注册失败会阻断 agent 启动（fail-closed），不会静默跳过。
# - 默认空列表表示不加载第三方执行代码。
extension_plugins:

# 真实模型接口地址；不设置默认端点，填写或通过 /model 保存。
api_base: ""

# API Key：
# - 不要把真实 key 写进仓库
# - 本地运行时优先从环境变量读取
# - 如果你非常确定这是本地私有文件，也可以手动填到这里，但不建议
api_key: ""

# API Key 对应的环境变量名
# Windows PowerShell 示例：$env:AGENT_API_KEY="你的key"
# macOS / Linux 示例：export AGENT_API_KEY="你的key"
api_key_env: "AGENT_API_KEY"

# 可选自定义模型请求头（JSON/YAML 对象）；禁止覆盖认证、Cookie 和 HTTP 传输字段。
model_custom_headers: {}
# 可选稳定会话头名称，例如 OpenCode Go 的 x-opencode-session；值由宿主生成，勿写静态 UUID。
model_session_header: ""
# OAuth 运行引用由 /model 根据当前用户生成，不含令牌；请勿手填，登录在模型菜单中操作。
model_auth_ref: {}
# 慢模型或单槽模型的额外排队预算（秒，0 至 86400）；只延长首事件等待，不改变流式空闲超时。
# /model 可针对每个模型设置；默认 0，普通模型请求不增加等待。
model_queue_wait_seconds: 0

# 模型名称；不设置占位名称，不回退到其它模型。
model_name: ""

# HTTP 基础超时秒数：非流式请求把它当总时长下限；流式请求把它当首包后的滚动空闲窗口。
# 首包等待会根据本轮输入量单独扩展，健康流式输出不会再被这个值当作整次总墙钟强杀。
request_timeout: 240

# 模型单次回答最多生成多少 token（含推理内容），所有模型统一 64K。
# 实际发送值 = min(本值, 模型上下文窗口 ÷ 4)：窗口已知（/model 模型档案带入，或本文件写了 model_context_window_tokens）时，
# 构造后端时按该窗口夹取，给输入留出至少四分之三窗口；窗口未知时按本值发送。compact 预算与超时估算用同一个值。输出上限也会从输入可用空间里预留，
# 所以窗口较小（如 128K）的模型调大本值会让压缩更早触发。
max_tokens: 65536

# 当前模型一次最多能看多少 token（上下文窗口）；决定什么时候自动压缩对话，也限制单次输出最多占窗口的四分之一：
# - 留空（默认）= 先用服务商报告的窗口，拿不到就按 128000 算。
# - 填数字 = 就按这个数算，不再看服务商报告的值（/model 里给每个模型填的窗口就是这种）。
# - 只有服务商报“超出上下文”、或压缩明显太早/太晚时才需要填。
model_context_window_tokens:
# 当前模型声明的输入模态（例如 [text, image]）。通常由 /model 档案的"输入模态"字段带入；留空表示未知，
# 含图历史压缩时会用一次结构化视觉探针判断能否随图摘要，不按模型名猜。
model_input_modalities: []

# 采样温度（0 到 2，越高回答越发散）：
# - 留空（默认）= 不发送，用服务商自己的默认值，大多数模型这样最稳。
# - 填数字 = 每次请求都带上这个温度；/model 里给单个模型填的温度优先。
# - 一般不用改；只有明确知道某个模型需要固定温度时才填。
temperature:
# 核采样概率，留空沿用供应商默认，显式值为 0 至 1。
# 已核对官方/OpenCode Go/Zen 的 DeepSeek V4 Flash 思考模式默认 0.95，低于 0.95 按协议提升。
# 其它模型/私有代理未填写时不发送；/model 可按单个模型覆盖。
top_p: null

# 智能程度（推理强度）全局默认档位，会话里可用 /effort 单独设置，派子代理时可用 effort 单独指定：
# - auto：不发任何推理参数，由服务商按默认方式思考（默认）。
# - off：请求时关闭思考。
# - low / medium / high / max：由低到高的思考深度。
# 实际怎么发送取决于当前模型的思考控制方式（下一项）；模型不支持时本设置不改变请求，/effort 会如实说明。
model_reasoning_effort: auto
# 当前模型的思考控制方式，通常由 /model 档案的"思考控制"字段带入：
# - auto：只对实测确认过的服务商给默认值（DeepSeek 官方 OpenAI 兼容接口按档位发送 reasoning_effort；
#   DeepSeek 官方 Anthropic 兼容接口按思考开关发送），其余一律视为不支持、不发参数。
# - effort：按档位发送（OpenAI 兼容接口写 reasoning_effort，Anthropic 兼容接口写 output_config.effort）。
# - budget：按思考预算发送（Anthropic 兼容接口写 thinking.budget_tokens；部分服务商只按开/关生效）。
# - none：不支持调节，不发任何推理参数。
model_reasoning_control: auto
# 当前模型声明的服务商思考档位（例如 [low, medium, high, xhigh, max]），通常由 /model 档案带入（ChatGPT 订阅模型添加时
# 从服务商目录自动带上）；只用于 OpenAI Responses 接口把 /effort 档位对应到服务商真实支持的取值：
# - 留空（默认）= 未声明，只发通用的 low / medium / high（“最高”也按 high 发），不发可能被拒的取值。
# - 填写后 = “最高”按 max → xhigh → high 取第一个存在的；“关闭思考”只在声明了 none 或 minimal 时发送。
model_reasoning_levels: []
# 智能程度自动检测：用户把 /effort 设成 auto 以外的档位，而当前模型没有声明思考控制方式、又不在上面已核对的名单里时，
# 宿主用已保存的凭据在后台检测一次：同一道短题按“低”“最高”和不带参数各发 3 次，比较用量里的推理 token
# （接口不单独报告推理 token 时比较输出 token）。确认支持就把这个模型档案的思考控制改为 effort（可用 /effort revert 撤销），
# 不支持就如实记录；凭据只在宿主内部使用，不进入模型上下文。每个模型只自动检测一次，会额外发 9 次请求、消耗少量 token。
# - true：开启（默认）。
# - false：不自动检测；仍可用 /effort probe 手动检测。
reasoning_control_auto_probe: true
# 当前模型的结构化输出方式（记忆整理、自动总结 Skill 等后台结构化调用使用），通常由 /model 档案的"结构化输出"字段带入：
# - auto：只对实测确认过的服务商改用 json_object（DeepSeek 官方 OpenAI 兼容接口不接受 json_schema），其余用原生方式。
# - native：用接口自带的严格方式（OpenAI 兼容接口发 json_schema，Anthropic 兼容接口用强制工具信封）。
# - json_object：只适用于 OpenAI 兼容接口；发 JSON 对象模式，并把 schema 写进提示，结果仍由程序严格校验。
model_structured_output: auto

# ===== 嵌入服务（记忆和工具共用）=====
# 语义检索要先把文字变成向量，这件事由下面配置的“嵌入模型档案”来做。记忆的语义召回（memory_semantic_recall）
# 和工具的语义检索（tool_vector_search_enabled）共用这一个档案引用，两个开关各管各的功能。

# /model 里 embedding 用途的模型档案编号（在 /model 列表查看）。留空就是不用语义检索：记忆和工具都只按关键词找，
# 不发任何嵌入请求。指定时必须存在、启用且支持 embedding；档案失效明确失败、不回退到聊天模型，语义通道退回关键词。
# 档案决定把记忆内容发给哪个服务商，属于安全边界：仅用户经 /settings 修改，模型不能改；重启 Gateway 后生效。
# 换成另一个档案后，已存下的记忆向量不会自动重算，语义召回会退回关键词，可用 /memory vectors rebuild 重新嵌入。
embedding_model_profile: ""

# Anthropic-compatible 原生多轮工具请求主动缓存：
# - true：在稳定工具清单、首条任务提示和最新历史块写 cache_control 断点，长任务可增量复用旧前缀。
# - false：不写主动缓存字段，供不支持该标准字段的兼容端点使用。
# 普通单次聊天不受影响；开启后首次缓存写入会按供应商规则计费，后续命中通常显著降低成本和延迟。
anthropic_prompt_cache_enabled: true

# 是否启用工具调用循环
enable_tools: true
# 允许显式插件管理；未安装并启用时不加载插件、不启动额外进程。关闭后仍可查询原结果。
enable_plugins: true
# 插件进程 OS 沙箱（试点，默认关闭）：
# - false：插件进程以你本人的权限运行（现状）。
# - true：每个插件进程都放进系统沙箱（Linux 用 bubblewrap，macOS 用 sandbox-exec），能读的范围不变，
#   但只能写它自己的插件数据目录；网络不受影响。本机沙箱不可用时插件不会启动（不会悄悄退回无沙箱）。
#   注意：需要写工作区文件的插件（例如导出、恢复快照）在沙箱里写入会失败；它也不是网络边界。修改后重启 Gateway 生效。
plugin_process_sandbox: false

# 是否启用流式模型响应；关闭后走一次性响应路径，便于排查模型接口问题。
stream_enabled: true

# 工具轮数和单代理工具预算：
# - 空值=用代码默认 5000 轮(极高级别保护:正常深度任务几百轮远够,5000 只拦
#   真失控死循环，总轮数兜底是最后防线)。 不截停
#   主循环:5000 等效
#   不限制,但真失控有硬顶,不会无限烧时间/成本。
# - 普通可恢复工具失败只返给模型换路，不替模型结束 turn；精确同参重复调用门、
#   unknown_command_budget(200 次/10 分钟)、compact 防抖负责有界保护。
# - 显式正数仍可限制,显式 0 才是真正不限制;单任务临时覆盖由任务属性显式传入。
max_tool_rounds:
# 模型一次提出多个工具调用时，最多同时执行几个，默认留空 = 8：
# - 写数字 = 最多同时跑这么多个，多出来的排队接着跑，一个都不会丢；0 = 不限制，能并行的全部同时跑。
# - 只有能安全并行的调用（比如只读、互不冲突的写）才会同时跑，这里只是上限。
# - 一般不用改；工具慢又互不干扰时可以调大，机器吃紧时调小。
max_parallel_tool_calls:
# 每个代理最近 10 分钟最多调用几次工具，默认留空 = 不限制：
# - 写数字 = 超过就暂时拒绝新的工具调用，等时间窗口滚过去自动恢复；主代理、每个子代理各算各的。
# - 留空或 0 = 不限制。只有想防止某个代理空转、狂调工具烧钱时才设，比如 200。
tool_agent_budget_max_calls:

# 后台调度器的周期性孤儿 supervision（reconcile 兜底，零 LLM 成本）：
# - 事件唤醒只覆盖"有人发信号"的死亡；宿主进程被 SIGKILL/断电类静默死亡不发任何 wake，
#   而定时提醒策略只有模型调过 wait 才存在——靠这里按间隔巡查兜底。
# - 动作：盯守死岗补建接管 run + durable 复活 PENDING/PLANNING 停滞孤儿（心跳新鲜的
#   在岗 runner 绝不误碰；尝试爆表的留给模型裁决）。无候选即 no-op，近零开销。
# - 0=关闭。
orphan_supervision_interval_seconds: 60

# 持续目标连续多少个自动续跑片没有工具调用、Goal revision 或任务状态变化时暂停：
# - 达到上限后目标进入可用 /goal resume 恢复的 paused 状态，并通过宿主提示告知用户。
# - 0 = 不限；默认 3。用户新消息或显式恢复会重新开始计数。
goal_continuation_idle_limit: 3


# 检索完备性软引导：
# - 同一工具明确的网络/能力不可用回执按 call_id 去重后达到阈值，提示核对其它授权来源。
# - 测试/编译非零、参数/状态/权限错误、取消和未知失败不等于工具不可用，不计入该阈值。
# 软引导阈值已降为代码常量（tool_guard/loop_hints._CHANNEL_HINT_THRESHOLD，2026-09-28 参数减量）。

# 读取“已外置的大工具输出”（artifact 正文）的额度：同一个 run 最近 10 分钟最多读这么多字符，默认 240000：
# - 超了就暂时拒绝，等时间窗口滚过去自动恢复，防止模型反复整段读大输出把上下文和费用撑爆。
# - 0 = 不限制。一般不用改；确实需要一次读很多归档正文时再调大。
tool_artifact_read_budget_max_chars: 240000

# 工具输出归档和工具调用解析预算：
# - tool_output_externalize_min_chars: 工具输出达到多少字符或 UTF-8 bytes 后外置为 artifact；0 表示所有工具输出都外置。
#   几 KB 的定位/抽取结果会直接进入下一轮上下文，避免模型只看到“命令完成”却看不到证据。
# - tool_output_preview_chars: archive 记录里保留多少字符预览；完整内容走 artifact 引用读取。
# - tool_output_externalize_on_low_headroom: 一条工具输出的估算 token 已不小于距自动压缩点的剩余余量时，即使没到
#   上面的字符阈值也立刻外置（模型只看预览和恢复锚点），并让下一次模型请求前先走统一压缩；用来避免同一轮多条大结果
#   把上下文冲过窗口后压缩再也放不下（COMPACT_CANDIDATE_TOO_LARGE）。关掉则只按字符阈值外置。
# - tool_payload_*: 只限制模型发来的单次工具调用 JSON 形状，防止坏 payload 撑爆上下文；不是业务字段枚举。
tool_output_externalize_min_chars: 200000
# 工具输出太长时会存成文件，对话里只留一段预览，需要时再按引用读全文。
# 这个数就是预览保留的字符数，`0` 表示不留预览；一般不用改。
tool_output_preview_chars: 4000
# 工具输出快到自动压缩临界点时是否提前外置成存档。
# 开启时能避免同一轮里好几条大结果把上下文挤爆；关掉后就只按固定的字符阈值来判断要不要外置，不再看剩余空间。
# 一般不用改。
tool_output_externalize_on_low_headroom: true

# 工具上下文回溯回收（microcompact）的保留条数与回收门槛都已固定为代码常量
# （DEFAULT_MICROCOMPACT_KEEP_RECENT / DEFAULT_MICROCOMPACT_MIN_CHARS，2026-09-28 参数减量）。

# 单轮 PTL（prompt-too-long）自救重试次数已固定为代码常量
# （tool_context/ptl_retry.DEFAULT_PTL_RETRY_MAX，2026-09-28 参数减量）。

# read_file 工具最多返回多少字符，避免单次结果太长
tool_read_max_chars: 16000

# 默认关闭；开启后，write_file/edit_file/apply_patch 沿原回执反馈有界 JSON 语法观察。
# 不拦截分块或故意无效的文本，不自动修复、不扫描目录，也不决定任务是否完成。
enable_file_syntax_diagnostics: false

# list_files 工具最多列出多少条结果
tool_list_max_entries: 200

# search_text 工具最多返回多少条匹配
tool_search_max_matches: 50

# web_fetch 返回给模型的默认预览字符上限。
# 全文或二进制内容应保存为 artifact 引用，不要直接塞进上下文。
tool_web_max_chars: 100000

# web_search / web_fetch 工具默认超时秒数
tool_http_timeout: 30

# 路径访问策略，主代理和所有子代理共用：
# - normal：默认模式；在 WorkspaceOnly 的 owner home 内可使用用户自己的全部文件（包括自己的配置文件），
#   框架权限、配额、运行账本等控制面路径仍只读。owner 墙外继续按危险目录和结构化工作区共同拒绝。
# - full：只在 local/main 管理员同时开启 access_mode=full-access 时真正路径全开；普通/远程 owner 不会提权。
# 说明：路径边界不限制外部网络；网络访问由各工具自己的网络策略控制。
path_access_mode: normal

# normal 模式下默认拒绝访问/写入的危险目录。可以按机器环境调整。
# 这里放的是系统目录和常见密钥目录，不包含用户项目目录、桌面、下载目录或 live-agent-runs。
path_dangerous_roots:
  - /etc
  - /private/etc
  - /System
  - /bin
  - /sbin
  - /usr/bin
  - /usr/sbin
  - /var/db
  - /var/root
  - /root
  - ~/.ssh
  - ~/.gnupg
  - ~/.aws
  - ~/.kube
  - ~/.docker

# 命令运行权限档位。这里只暴露一个总开关，其他命令安全策略由运行时派生：
# - restricted：保守模式，命令只能在配置工作区内执行，适合不信任任务。
# - workspace-write：默认开发模式，工作区就是当前 owner 的完整 home；不会继承启动 TUI 的 shell cwd。
# - full-access：仅 local/main 管理员生效，允许显式切到系统其他目录；子代理仍收窄为 WorkspaceOnly。
#   行为提示要求只有用户明确给出外部路径或要求系统排障时才离开 owner home；涉及其他 owner 时还要明确点名，
#   默认先只读、尽量少改。提示不产生权限，普通用户无法靠自然语言开启 Full Access。
# - full-access 仍拒绝 rm -rf /、删除系统/家目录、格式化磁盘、关机等灾难动作。
# 普通 rm/rmdir/chmod/sudo 不因名字本身被拒绝；真正的边界来自 access_mode、path_access_mode 和灾难命令保护。
# 模型不需要知道 grant/path_scope/apply 之类内部字段；它只调用 run_command。
access_mode: workspace-write

# run_command 工具默认超时秒数
tool_shell_timeout: 240

# run_command 的 stdout/stderr 分别最多回显多少字符
# 超出时只回显预览、总字符数和截断标记，完整大输出后续应走 artifact/日志引用
tool_shell_output_max_chars: 12000
# 后台服务的监听范围：模型经 run_command(run_in_background=true) 起的服务默认只允许监听本机回环地址（127.0.0.1/::1）；
# 要开放局域网必须在调用里声明 background_listen_scope=lan，首次由你在审批面板确认，可选"本用户长期允许"以后不再问；
# 自主审批模式也不会替你放开。声明 loopback 却绑到局域网地址时，后台 host 按真实 socket 表回收该服务并在记录里留证据；
# 设为 false 则只记 listener_warning 不回收。
background_process_listen_scope_enforce: true
# macOS 上 Shell 沙箱是否对"非本机管理员"的 owner（例如飞书等 IM 用户）拒读你的用户家目录（默认关闭）：
# - false：这些 owner 的命令读不到 my-agent 数据目录里别人的部分，但仍能读你家目录里的其它内容（如 ~/.ssh、其它项目）。
# - true：家目录里只有该 owner 自己的目录、工作区和授权目录能读；其 Shell 的 HOME 改指到 owner 自己的家目录，
#   git 等工具照常可用，但用不了你本人的 git/SSH 配置和凭据。本机管理员（local/main）与 Full Access 不受影响；
#   Linux 的 bubblewrap 本来就不挂载家目录，也不受影响。修改后重启 Gateway 生效。
shell_sandbox_hide_user_home: false

# 工具目录展示模式：
# - compact：给模型一份精简工具目录，默认推荐。
# - full：给模型完整工具详情，适合调试模板/工具选择问题。
# - retrieval_only：不铺完整目录，只靠 Recommended Tools 召回。
# - off：关闭工具目录注入，通常只用于极限省 token 的实验。
tool_catalog_mode: "compact"

# 工具目录按类别过滤；空列表表示不过滤。
# 例如 ["filesystem", "network"] 只展示文件和网络工具，但不改变真正授权。
tool_catalog_categories: []

# 渐进式披露：这些 category 的工具仍注册、仍受相同权限控制，但不进初始模型 schema；
# 模型通过 tool_search 搜索并加载命中工具，list_tools 可查看完整注册表。显式 allowed_tools
# 的后台/runner 回合本身已是结构化工具选择，不再延迟。默认收起协作、web、vision、meta 和 MCP；
# orchestration 与 goal 不收起，直属代理和持久目标控制默认首次调用就可见，避免把计划误当作已建立目标。
# 设为 [] 即恢复全部工具直出。
tool_catalog_deferred_categories: ["collaboration", "web", "vision", "meta", "mcp"]

# 工具目录条目是否带示例；默认关闭以控制每轮上下文，完整示例仍可通过 list_tools/tool_search 读取。
tool_catalog_include_examples: false

# 每次注入 prompt 的“工具详细说明”条数已固定为代码常量（agent/core.TOOL_RETRIEVAL_LIMIT，2026-09-28 参数减量）。

# 是否启用真实语义工具检索。向量来自“嵌入服务”一节的 embedding_model_profile 档案（与记忆语义召回共用）；没配档案时
# 语义通道明确标为 unconfigured 并只走关键词；端点故障时也降级关键词，错误可从 list_tools.tool_retrieval 查看。
tool_vector_search_enabled: true

# MCP 客户端（短板6）：连接外部 MCP server（Model Context Protocol，JSON-RPC over stdio），
# 把社区现成工具（GitHub/数据库/Slack 等）动态注册成 mcp__<server>__<tool> 前缀的工具，
# 模型可像内置工具一样调用，调用时转发给对应 server 的 tools/call。
# - 仅 stdio 传输：用 command + args 启动 server 子进程（标准库 subprocess 实现，零新增依赖）。
# - env：显式传给该 server 的额外环境变量（如凭证）；默认只继承 PATH/HOME 等安全基线，
#   不会把父进程其他敏感变量漏给 server 子进程。日志里 secret 键值自动脱敏。
# - timeout：单次 tools/call 超时（秒，默认 60）；connect_timeout：握手/发现超时（秒，默认 30）。
# - catalog_category：默认 mcp，继续由 tool_search 渐进披露；需要首轮直接可见的受控服务可用独立分类。
#   该字段只改变模型工具目录，不授予权限，也不降低 effect/审批。
# - effect：未知工具默认 dangerous，会进入幂等与审批硬门。只有部署者可用 tool_effects
#   逐工具显式声明 read_only / mutating / dangerous；不要根据 server 自报信息自动降级。
# - 默认空 = 不连任何 server、不启动任何子进程（零开销）。某 server 连不上只记日志跳过，
#   不影响其他工具与主流程。
# 注意：本仓配置用的是精简 YAML 解析器，dict 值必须写成单行 inline（flow）形式，
#   不支持多行缩进块写法。示例（默认空，要用时替换 {} 为下面这种单行 dict）：
#   mcp_servers: {"filesystem": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"], "catalog_category": "mcp", "tool_effects": {"read_file": "read_only", "write_file": "mutating"}}}
#   真实 server 若会先 list/search 再 read，部署者必须把这些实际只读工具也逐个声明 read_only；
#   未声明项继续 dangerous fail-closed，不能为了让模型跑通而整体降级 effect。
#   带凭证的 server（凭证经 env 显式传入，日志自动脱敏）：
#   mcp_servers: {"github": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-github"], "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_xxx"}, "timeout": 120}}
mcp_servers: {}

# Computer Use：直接复用 MIT 开源的 computer-control-mcp 执行鼠标、键盘、窗口、截图和 OCR，
# my-agent 只通过现有 MCP/Tool Gateway 做薄适配，不重复实现桌面自动化引擎。
# - 安装：pip install 'my-agent[computer-use]'；当前执行器的 OCR 依赖支持 Python 3.10-3.13。
# - 默认 false：headless Gateway 不启动图形子进程，也不承担 OCR/ONNX 依赖。
# - 只有结构化 local/main 管理员 + access_mode=full-access 才会注册；远程/普通 owner 即使改配置也不可见。
# - 截图/OCR 和所有输入动作按 dangerous 审批；窗口枚举/屏幕尺寸/等待只读，移动鼠标/激活窗口按 mutating。
# - Linux 复用 Gateway 当前 DISPLAY/WAYLAND/XAUTHORITY 会话；没有可用桌面会明确表现为工具不可用。
computer_use_enabled: false


# Chat 界面交互历史带多少轮；模型使用的同会话历史预算见下面 conversation_history_*。
chat_history_max_turns: 20
# Agent 模型使用的同会话历史预算，与上面的界面展示预览严格分开。
# 总量不足时只整条淘汰最旧消息；普通用户/助手正文不做滑动头尾截断，达到阈值后统一 Compact。
conversation_history_max_turns: 20
# 每次请求最多带多长的对话历史（字符）。
# 调大记得更多但更费 token，调小更省但更容易「忘事」；一般不用改。
conversation_history_max_chars: 48000
# 普通回合结束后，把本轮工具轨迹一次性写进 assistant metadata，供后续轮继续使用。
# 这不是 Compact，不增加 compact 次数；metadata 只写一次，读取时按下面的热期选择固定投影。
conversation_terminal_tool_fold_enabled: true
# 缓存仍可能有效时保留更完整的有界工具尾巴；过期后才切换成短折叠，避免一分钟内追问就主动破坏热前缀。
# 0 表示立即短折叠。不同模型/网关缓存时长可能不同，应按 provider cache-read 账本校准，不按延迟猜测。
conversation_terminal_tool_hot_tail_seconds: 300
# 命令行清理旧审计记录时保留多少天。
# 超过这个天数的审计条目会被删掉。
# 调小会提前删除审计证据，所以只有在明确知道自己在放弃多久以前的记录时才改。
# 写成 `0` 表示永久保留，清理时不删除任何记录；单次命令也可以用 `--days` 临时覆盖。
# （安全边界：只能由用户在配置文件里改，模型不能改）
cli_audit_cleanup_days: 90

# 决策增强：默认关闭；保存设置不发网络请求。修改时间只作用后续请求，不重置已开始阶段的预算。
decision_enabled: false
decision_experiment_enabled: false  # 仅实验能力开关；另需宿主显式有界授权，当前缺可靠输入上界时禁止实验联网
# observe 采样：开着只会给 observe 点位按自然小时限流，每点位每小时成功调用满 6 次就先停，这一小时不再问决策模型；
# 失败和超时不算名额（出问题的点位会一直被观察），apply 点位完全不受影响。默认关=现在行为不变。
decision_observe_sampling_enabled: false
# observe 不挡回复：开着时，会话里处于观察模式的决策点改在后台问决策模型，回复不用再等它（观察结果照样记日志和用量）；
# 后台等待上限用下面的 decision_background_timeout_seconds。apply（正式使用）、实验和后台点位不受影响。
# 默认关：决策的行为与时序不变，只是结果日志每行多一个附加字段 blocking。
decision_observe_nonblocking_enabled: false
decision_timeout_seconds: 3.0  # 前台单次等待；必须为有限正秒数
decision_stage_timeout_seconds: 4.0  # 同一阶段累计等待；必须为有限正秒数
decision_background_timeout_seconds: 4.0  # 后台单次等待；必须为有限正秒数
# 决策调用复用长连接：打开后同一进程里的决策请求复用已经建好的 HTTPS 连接，省掉每次约 0.9 秒的代理隧道与 TLS 握手
# （2026-10-01 实测：复用后单次快约 1 秒）。空闲超过 60 秒的连接不再复用；复用连接上发送失败照常算一次失败，不会自动重发。
# 默认关（新功能先关，线上验收后再开）：关着就是每次新建连接的老做法。不改请求内容、重试次数或等待期限。
decision_connection_reuse_enabled: false
# 决策点诊断记录（被挡下的跳过行 + 到达/未触发原因计数），一个开关同时管两样，关闭后两样都不记。
# 跳过行：已到触发点、该点也已开启，却被条件挡下时，在决策结果日志记一条 skipped（原因码 privacy_url：要外发的材料含带查询串的 URL），日志有界（最近 1000 条）。
# 到达计数：每个点位每次检查的结果（真正调用了，或没调用的原因，如“这一步不是运行测试的命令”），只在进程内累加，每个用户最多每分钟合并写一次盘、保留 7 天。
# audit_records 和 TUI 决策菜单据此用大白话说明“最近为什么没触发”，不会把 0 次误判为没接线。默认开着就好。
decision_skip_records_enabled: true
decision_profile_id: ""  # 原模型目录的 Decision 引用；空表示未绑定，不保存第二份凭据
# 各决策点位的单次期限与决策模型不在配置文件里逐个设置：默认继承上面的通用期限与 decision_profile_id；
# 需要给某个点位单独设时，用 TUI 决策菜单的“逐接入点设置”，或让 my-agent 用 user_config 的 decision_patch 按点位覆盖。
decision_model_selection_mode: off  # off 关闭 / observe 仅观察建议与输入 token / apply 采用合法建议；不计算决策模型价格
# 选模型多久问一次决策模型：every_turn 每条消息都问（默认，与以前一样）；structure_change 只在新会话、这次会话压缩之后、
# 模型目录（可选模型）变化或当前模型被换掉时才问，结构没变就沿用上次的判断、不再调用。也可以在 TUI 决策菜单或让 my-agent 按会话单独设置。
decision_model_selection_cadence: every_turn
# - 规划（planning）、交付质量（delivery_quality）、动作候选（action_candidate）三个决策点位发给决策模型的当前请求字数：
#   更长时自动取开头和结尾的节选（中间写明省略多少字），并如实标注为节选，决策照常进行；一般不用改。
#   0 表示不截取，但仍受决策协议 256 KB 输入上限约束。选择模型点位的两段材料上限是内部常量（只截开头），不是用户参数。
decision_request_max_chars: 2000
decision_external_material_order_mode: off  # 已归档批量网页的阅读优先级提示；observe 仅观察，apply 追加建议，不删改原页或来源
decision_planning_mode: off  # 现有 Todo 优先级建议；observe 仅观察，apply 只附软提示，不创建目标、待办或子代理
decision_delivery_quality_mode: off  # 交付复核焦点：run_command 产生新验证事件后建议先复核哪个已有焦点；observe 仅观察，apply 只追加提示，不跑测试、不改结果或完成状态
decision_action_candidate_mode: off  # 动作候选：插件只读观察工具返回宿主校验过的候选后，建议下一步先核对哪个候选；observe 仅观察，apply 只追加提示，不执行动作、不生成参数
decision_skill_proposal_review_mode: off  # 仅用户长期设置：`skills proposals list` 有 2—30 条待确认 Skill 提案时请决策模型建议审核先后；observe 仅观察，apply 只重排展示并加标签，不确认、拒绝或改写提案/Skill
memory_decision_pre_recall_mode: off  # 召回前补充查询建议；始终先执行原召回，不依据自然语言或决策跳过历史
# 召回前补充查询的片段材料：query_text 只给片段文字（默认，与原做法相同）；
# with_new_facts 时宿主先按原检索预检每个片段能新增的正式事实（不记访问），把条数与摘要交给决策模型，补不出新事实的片段不给选，
# 全都补不出就不调用。每个片段多一次查询嵌入。也可以在 TUI 决策菜单或让 my-agent 按会话单独设置。
memory_decision_pre_recall_fragment_material: query_text
memory_decision_recall_mode: off  # 记忆召回决策；不绕过原读取权限
memory_decision_curator_mode: off  # 记忆整理决策；不授予写人格或晋升权限
memory_decision_curator_relation_mode: off  # 用户后台独立开关：新来源与完整、带版本正式条目的关系建议；不直接合并或晋升
