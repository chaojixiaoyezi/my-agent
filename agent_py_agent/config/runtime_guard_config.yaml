###############################################################################
# 运行门、提醒与返工预算配置
###############################################################################
#
# 这一个文件集中放“同一类”的运行门数字：探索提醒、本地进展提醒、
# 交付验收返工预算。
#
# 它不写任务类型，不写产物类型，不写 GitHub/PDF/XLSX/购物站等专项流程。
# 这些配置只回答一件事：当模型没有推进或交付没过时，
# 系统多久提醒、什么时候允许按次数停止。
#
# 共同约定：
# - 统计单位写在每个小节里；不要默认理解成“单个工具调用”。
# - 对“会阻断”的阈值，0 表示不按次数阻断。
# - 对“只提醒”的间隔，0/负数/非法值会回退默认值，避免完全失去提醒。

###############################################################################
# 工具重复失败/无进展提醒与动作级拦截
###############################################################################
#
# 统计单位：同一 run 内的“同工具 + 同参数 + 同类失败/无进展”次数。
#
# 默认 10 表示：
# - 第 10 次：给第一次中文返工提示，提醒模型换关键词、参数、工具或数据来源。
# - 第 20 次：给第二次更强中文返工提示。
# - 第 30 次之后如果还要原样调用：拦截这一次工具调用，返回合成工具结果要求换路。
#
# 这个门默认只拦“本次重复工具调用”，不会杀掉整个任务。
# 填 0 表示不限制、不拦截；系统只在 50、100 次给软提示，提醒模型尽快收束或换路。
repeat_fail_threshold: 10
readonly_no_progress_threshold: 3

# 是否把 3 倍阈值后的重复撞墙标成 terminal_block 诊断。
# 普通工具循环不会因此杀任务，只会把诊断和换路建议塞回下一轮提示。
# 默认 false：只拦截重复动作，不带 terminal_block 诊断。
terminal_block_enabled: false

###############################################################################
# 工具工程限流与熔断
###############################################################################
#
# 统计单位：同一 run 内的“同工具 + 同参数 hash”。
# 这组配置保护工具网关和外部服务，不替模型决定任务路线，也不因为一次普通失败终结任务。
# 如果某个长期监控、批量采集或特殊工具需要不同频率，可以在 write_boundary 里显式覆盖。
#
# tool_rate_window_seconds:
#   统计窗口秒数。默认 60 表示按 1 分钟窗口统计。
# tool_rate_max_calls:
#   窗口内最多允许多少次同 tool+args 调用。0 表示不限频率。
# tool_circuit_failure_threshold:
#   连续多少次 retryable 失败后打开 circuit。0 表示不启用失败熔断。
# tool_circuit_backoff_seconds:
#   circuit 打开后的退避等待秒数。空格不影响解析，例如 [1,2,4] 和 [1, 2, 4] 都可以。
# tool_rate_max_records:
#   每个运行边界最多保留多少条限流记录，防止账本无限增长。
tool_rate_window_seconds: 60
tool_rate_max_calls: 60
tool_circuit_failure_threshold: 3
tool_circuit_backoff_seconds: [1, 2, 4, 8, 16, 30]
tool_rate_max_records: 256

###############################################################################
# 单代理工具预算
###############################################################################
#
# 统计单位：同一 run_id 在滚动窗口内的工具调用次数。
# 这条门主要用于子代理/后台 runner，防止单个代理持续调用工具空转。
# 没有 run_id 时不生效，避免把主代理普通聊天或不同任务混到同一个预算桶里。
#
# tool_agent_budget_window_seconds:
#   滚动窗口秒数。默认 600 表示最近 10 分钟。
# tool_agent_budget_max_calls:
#   窗口内最多允许多少次工具调用。0 表示关闭这个单代理预算门。
tool_agent_budget_window_seconds: 600
tool_agent_budget_max_calls: 200

###############################################################################
# 探索空转提醒/熔断
###############################################################################
#
# 统计单位：工具轮。
# 如果一轮工具调用全是 read/search/fetch/list 等只读探索动作，
# 且没有 write/build/checkpoint 这类本地落地动作，就累计 1 轮。
#
# 默认 50 表示连续只探索不落地时，在第 10、20、40 轮给模型逐步增强的软提示。
# 本机制不按轮数强制终止普通任务；真正的工具预算和后台切片由下方独立结构化参数负责。
# 填 0 表示不用比例提醒，只在 unlimited_hint_rounds 指定轮次提示。
round_threshold: 50

# round_threshold=0 时的固定软提示轮次。
# 空格不会影响解析，例如 [50,150,250] 和 [50, 150, 250] 都可以。
unlimited_hint_rounds: [50, 150, 250]

###############################################################################
# closeout 失败后的本地进展提醒
###############################################################################
#
# 统计单位：工具轮。
# 只在 closeout 已经失败、失败指纹没变、工作区进展指纹也没变时生效。
# 它防的是“已经知道交付没过，但模型继续只读/只搜/只抓，不修产物”。
#
# 每隔多少轮给一次固定软提示。
# 这是本地进展提醒唯一参数：它只提醒，不阻断，不参与 closeout 成败判断。

# 工具轮与 runner 重派预算
###############################################################################
#
# max_tool_rounds:
#   一次主代理/runner 工具循环最多允许多少个工具轮。
#   这里的“工具轮”是模型一次回复里请求的一批工具，不是单个工具调用。
#   0 表示不限制。默认 0，普通任务不应该被工具轮数卡住。
max_tool_rounds: 0

# background_max_tool_rounds / background_max_tool_calls_per_round:
#   内部后台唤醒只是同一任务的一次有界续跑切片，不应在一次 claim 内无限读取。
#   默认最多 32 个模型工具轮、每轮执行前 4 个调用；未执行调用会留下明确回执，
#   任务仍由同一持久会话和进度策略续接。真实用户新消息与到点计划任务不套此上限。
background_max_tool_rounds: 32
background_max_tool_calls_per_round: 4

# runner_failure_retry_limit:
#   子代理 runner 失败后最多允许补跑几次。默认 2 表示：
#   第 1 次正常执行失败后，最多还可以再补跑 2 次。
#   这是上限，不是强制；父代理仍可自行决定接管、拆小任务、换子代理或问用户。
runner_failure_retry_limit: 2

# same_run_redispatch_limit:
#   同一个 run_id 失败后，最多允许被重新派几次。
#   默认 1 表示同一个 run_id 失败后最多再派一次；再失败时提醒父代理换策略。
#   0 表示不限制同 run_id 重派次数。
same_run_redispatch_limit: 1

###############################################################################
# 模型网关临时错误自动续跑
###############################################################################
#
# provider_transient_auto_resume_delays_seconds:
#   主代理/子代理模型回合遇到 provider 临时错误时的自动等待表。
#   适用范围：HTTP 429、503、504、临时 5xx、模型网关临时断连这类可恢复错误。
#   它只重试“当前模型回合”，不会重启整轮 run，也不会重复执行已经完成的工具。
#   默认 [10, 25, 45, 100, 180] 表示最多自动重试 5 次；全部耗尽后输出可恢复报告。
#   配成 [] 表示不做自动续跑，直接把 provider_transient 报告给用户/父代理。
provider_transient_auto_resume_delays_seconds: [10, 25, 45, 100, 180]

# provider_supply_backoff_base_seconds / provider_supply_backoff_max_seconds:
#   模型供应断供(429 限流/额度用满)超过上面短链后，网关后台消费循环
#   (唤醒/观察/盯守判读)按会话做的第二层长退避：第 n 次连续失败等
#   base*2^(n-1) 秒（封顶 max），到点自动重试；成功即清零。
#   额度按分钟/小时刷新，秒级轮询猛打只会加重限流。唤醒信号/盯守 policy
#   在退避期间不被标记消费，供应恢复后自动续跑，不需要人肉重启。
#   默认 30 / 900：30s→60s→120s→240s→480s→900s→900s…
provider_supply_backoff_base_seconds: 30
provider_supply_backoff_max_seconds: 900

# provider_transient_redispatch_limit:
#   子代理 runner 因【临时供应错】(failure_type=transient_error，429 限流/断供)
#   进 BLOCKED 后的独立同 run 重派上限。供应断供是环境故障不是任务失败，
#   不烧 runner_failure_retry_limit / same_run_redispatch_limit 的任务失败预算
#   （否则几分钟断供把两道默认闸烧穿，任务永久卡 BLOCKED，额度恢复也不复活）。
#   默认 8；配 0 表示关闭此特权，供应类失败回归与普通失败同闸。
provider_transient_redispatch_limit: 8

###############################################################################
# 主任务自动恢复预算
###############################################################################
#
# 统计单位：同一个主任务在中断/失败后的自动恢复次数。
# 这条门只管 Supervisor/Recovery Runtime 自动尝试续跑多少次，不代表模型必须重跑。
#
# 默认 3 表示主任务异常中断或恢复包可续跑时，系统最多自动恢复 3 次。
# 填 0 表示不按次数限制自动恢复；仍然要受 checkpoint、lease、产物/副作用安全检查约束。
main_agent_auto_resume_attempt_limit: 3
