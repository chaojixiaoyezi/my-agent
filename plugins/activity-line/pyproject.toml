[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-activity-line"
version = "0.1.0"
description = "在面板显示当前运行状态、活动与耗时"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
activity_line = ["declaration.json"]
