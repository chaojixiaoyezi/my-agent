[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-context-inspector"
version = "0.1.0"
description = "在面板查看当前会话的上下文组成与压缩次数"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
context_inspector = ["declaration.json"]
