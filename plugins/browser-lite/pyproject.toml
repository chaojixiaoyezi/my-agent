[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-browser-lite"
version = "0.1.0"
description = "在专属无头浏览器上下文里打开受控页面、读取元素、点击和填写测试表单"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["my-agent-plugin-api==0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
browser_lite = ["declaration.json"]
