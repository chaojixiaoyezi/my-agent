[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-drama-media-shell"
version = "0.1.0"
description = "离线短剧提示词检查与夹具生产作业外壳"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["my-agent-plugin-api==0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
drama_media_shell = ["declaration.json", "LICENSE.drama-skills", "PROVENANCE.md"]
