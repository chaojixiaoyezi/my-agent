[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-plugin-api"
version = "0.2.0"
description = "my-agent 插件的纯工作区读写协议与共用路径裁决"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[tool.setuptools]
packages = ["my_agent_plugin_api"]
package-dir = {"" = "src"}
