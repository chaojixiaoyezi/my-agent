# 需要集群已安装 Gateway API，并把 parentRefs.name 改成目标集群真实 Gateway。
# 默认 canary=0；灰度控制器只在健康门通过后按 1→5→10→25→50 提升。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-agent-ingress
spec:
  parentRefs:
    - name: my-agent-public
  # fail-closed placeholder；部署前必须改成飞书 webhook 的真实专用 hostname。
  hostnames: ["my-agent.invalid"]
  rules:
    - backendRefs:
        - name: my-agent-ingress
          port: 80
          weight: 100
        - name: my-agent-ingress-canary
          port: 80
          weight: 0
